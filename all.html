<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>綜合禱告卡片</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙏</text></svg>">
<style>
  :root {
    --main-primary: #3d4a5c;
    --main-primary-light: #dde1e6;
    --main-primary-light-text: #2c3644;
    --text-main: #2a2f36;
    --text-sub: #6b7280;
    --clay: #8a6a4e;
    --clay-light: #e6d9c8;
    --clay-light-text: #4a3728;
    --teal: #3d7a68;
    --border: #d9dce0;
    --border-strong: #c2c6cc;
    --text-danger: #b0413e;
    --danger-light: #f5e0df;
    --gray-bg: #f0f1f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--gray-bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .header { width: 100%; max-width: 480px; text-align: center; padding: 12px 0; }
  .header h1 { font-size: 20px; color: var(--main-primary); margin: 0; }
  .progress { font-size: 14px; color: var(--text-sub); margin-top: 4px; }
  .progress-breakdown { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .filter-row {
    width: 100%; max-width: 480px; display: flex; flex-wrap: wrap;
    gap: 6px; margin-top: 10px; justify-content: center;
  }
  .filter-row button {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--main-primary);
    background: white; color: var(--main-primary); font-size: 12px;
  }
  .filter-row button.active { background: var(--main-primary); color: white; }
  .card {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px 20px;
    margin-top: 12px;
  }
  .source-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    color: white;
  }
  .source-badge.habit { background: #5b7fa6; }
  .source-badge.network { background: #3d9e8f; }
  .source-badge.multi { background: var(--clay); }
  .source-badge.task { background: #a65b8a; }
  .dup-warning {
    display: inline-block;
    margin-left: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    color: var(--text-danger);
    background: var(--danger-light);
  }
  .prayer-text {
    font-size: 22px;
    line-height: 1.6;
    min-height: 120px;
    white-space: pre-wrap;
    outline: none;
    border: none;
    width: 100%;
    background: transparent;
    font-family: inherit;
    resize: none;
    color: var(--text-main);
    margin-top: 12px;
  }
  .prayer-text:focus { background: var(--main-primary-light); border-radius: 8px; }
  .prayer-text[readonly] { color: var(--text-sub); }
  .readonly-hint { font-size: 11px; color: var(--text-sub); margin-top: -6px; }
  .meta-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .meta-field { flex: 1; min-width: 130px; }
  .meta-field label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  .meta-field select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 15px; background: white;
  }
  .meta-field.cycle select { background: var(--main-primary-light); border: 1px solid var(--border-strong); }
  .meta-field.cycle select.cycle-empty {
    background: #ff8a80; border: 1px solid #d32f2f; color: #7a0000; font-weight: bold;
  }
  .meta-field.tag select { background: var(--main-primary-light); border: 1px solid var(--border-strong); }
  .meta-field.weekday select { background: var(--main-primary-light); border: 1px solid var(--border-strong); }
  .note {
    display: block; margin-top: 14px; font-size: 13px; color: var(--text-sub);
    white-space: pre-wrap; width: 100%; border: none; outline: none; background: transparent;
    font-family: inherit; resize: none; padding: 0;
  }
  .note:not([readonly]) {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: white;
  }
  .note:not([readonly]):focus { border-color: var(--main-primary); }
  .add-tag-row {
    display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .add-tag-row input[type="text"] {
    flex: 1; min-width: 100px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); font-size: 14px;
  }
  .add-tag-checkbox { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-sub); white-space: nowrap; }
  .add-tag-checkbox input { width: 16px; height: 16px; }
  .add-tag-row button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--main-primary);
    background: white; color: var(--main-primary); font-size: 13px; white-space: nowrap;
  }
  .quad-actions { display: flex; gap: 6px; margin-top: 12px; }
  .quad-btn {
    flex: 1; min-width: 0; padding: 8px 2px; border-radius: 8px; border: 1px solid var(--main-primary);
    background: white; color: var(--main-primary); font-size: 11px; line-height: 1.3; cursor: pointer;
  }
  .quad-btn:active { opacity: 0.7; }
  .controls { width: 100%; max-width: 480px; display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1;
    padding: 16px 0;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: var(--main-primary);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.prev { background: var(--main-primary-light); color: var(--main-primary-light-text); }
  .btn.next { background: var(--main-primary); }
  .btn.complete { background: var(--teal); }
  .btn.random { background: var(--clay); }
  .btn.speak { background: var(--clay); }
  .btn.pray-more { background: var(--clay); }
  .btn.pray-less { background: var(--clay-light); color: var(--clay-light-text); }
  .controls.triple { gap: 6px; }
  .controls.triple .btn { font-size: 14px; padding: 14px 2px; }
  .delete-row { width: 100%; max-width: 480px; display: flex; justify-content: center; margin-top: 10px; }
  .delete-row button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text-danger); font-size: 13px; opacity: 0.6;
  }
  .delete-row button:active { opacity: 1; }
  .repeat-row {
    width: 100%; max-width: 480px; display: flex; align-items: center;
    justify-content: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--text-sub);
  }
  .repeat-row .repeat-options { display: flex; gap: 6px; }
  .repeat-row button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--main-primary);
    background: white; color: var(--main-primary); font-size: 14px;
  }
  .repeat-row button.active { background: var(--main-primary); color: white; }
  .jump-row {
    width: 100%; max-width: 480px; display: flex; align-items: center;
    gap: 8px; margin-top: 14px; justify-content: center;
  }
  .jump-row input {
    width: 70px; padding: 8px; text-align: center; border-radius: 8px;
    border: 1px solid var(--border); font-size: 15px;
  }
  .jump-row button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--main-primary);
    background: white; color: var(--main-primary); font-size: 14px;
  }
  .status { margin-top: 10px; font-size: 12px; color: var(--text-sub); height: 16px; text-align: center; }
  .copy-tasks-btn {
    margin-top: 10px; width: 100%; padding: 10px; border-radius: 8px;
    border: 1px solid var(--main-primary); background: white; color: var(--main-primary);
    font-size: 14px; cursor: pointer;
  }
  .copy-tasks-btn:active { opacity: 0.7; }
  .danger-zone {
    width: 100%; max-width: 480px; margin-top: 24px; padding-top: 16px;
    border-top: 1px solid var(--border); display: flex; justify-content: center; gap: 10px;
  }
  .danger-zone button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text-danger); font-size: 13px; opacity: 0.6;
  }
  .danger-zone button:active { opacity: 1; }
  .danger-zone #openTrashBtn { color: var(--main-primary); }
  .trash-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    align-items: flex-end; justify-content: center; z-index: 20;
  }
  .trash-overlay.show { display: flex; }
  .trash-panel {
    width: 100%; max-width: 480px; max-height: 80vh; background: white;
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column; overflow: hidden;
  }
  .trash-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .trash-panel-header h2 { font-size: 17px; margin: 0; color: var(--main-primary); }
  .trash-close-btn { border: none; background: transparent; font-size: 18px; color: var(--text-sub); padding: 4px 8px; cursor: pointer; }
  .trash-list { overflow-y: auto; padding: 8px 20px; flex: 1; }
  .trash-empty-msg { text-align: center; color: var(--text-sub); font-size: 14px; padding: 32px 0; }
  .trash-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .trash-item-main { flex: 1; min-width: 0; }
  .trash-item-text { font-size: 14px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trash-item-meta { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .trash-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .trash-item-actions button { padding: 6px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .trash-restore-btn { border: 1px solid var(--main-primary); background: white; color: var(--main-primary); }
  .trash-delete-btn { border: 1px solid var(--border); background: white; color: var(--text-danger); }
  .trash-panel-footer { padding: 12px 20px; border-top: 1px solid var(--border); }
  .search-input-row { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .search-input-row input { flex: 1; min-width: 0; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 15px; }
  .search-input-row button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--main-primary); background: white; color: var(--main-primary); font-size: 14px; white-space: nowrap; }
  .search-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .search-item input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
  .search-item-main { flex: 1; min-width: 0; }
  .search-item-text { font-size: 14px; color: var(--text-main); white-space: pre-wrap; word-break: break-word; }
  .search-item-meta { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .search-merge-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--main-primary); color: white; font-size: 15px; }
  .oplog-item-state { font-size: 12px; white-space: nowrap; }
  .oplog-ok { color: var(--main-primary); }
  .oplog-pending { color: var(--text-sub); }
  .oplog-fail { color: var(--text-danger); font-weight: bold; }
  .oplog-summary { font-size: 13px; color: var(--text-sub); padding: 8px 20px 0; }
  .trash-empty-btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--text-danger); background: white; color: var(--text-danger); font-size: 14px; cursor: pointer; }
  .toggle-row {
    width: 100%; max-width: 480px; display: flex; align-items: center;
    justify-content: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--text-sub);
  }
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc; transition: .2s; border-radius: 24px;
  }
  .slider:before {
    position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
    background-color: white; transition: .2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--main-primary); }
  input:checked + .slider:before { transform: translateX(20px); }
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.7);
    display: none; align-items: center; justify-content: center;
    font-size: 15px; color: var(--main-primary);
  }
  .loading-overlay.show { display: flex; }
</style>
</head>
<body>

<div class="header">
  <h1>🙏 綜合禱告卡片</h1>
  <div class="progress" id="progress">載入中...</div>
  <div class="progress-breakdown" id="progressBreakdown"></div>
</div>

<div class="filter-row" id="filterRow">
  <button type="button" data-source="all" class="active">全部</button>
  <button type="button" data-source="habit">🔁 習慣</button>
  <button type="button" data-source="network">🌐 網絡</button>
  <button type="button" data-source="multi">🙏 多方</button>
  <button type="button" data-source="task">📋 待辦</button>
</div>

<div class="card">
  <span class="source-badge" id="sourceBadge"></span>
  <span class="dup-warning" id="dupWarning" style="display:none;"></span>
  <textarea class="prayer-text" id="itemText" placeholder="今天沒有待代禱的項目"></textarea>
  <div class="readonly-hint" id="readonlyHint" style="display:none;">姓名要到「為網絡禱告」頁面才能改，這裡唯讀；備註可以直接在下面編輯</div>

  <div class="meta-row" id="cycleRow" style="display:none;">
    <div class="meta-field cycle">
      <label>週期</label>
      <select id="cycleSelect"></select>
    </div>
  </div>

  <div class="meta-row" id="tagRow" style="display:none;">
    <div class="meta-field tag">
      <label>標籤</label>
      <select id="tagSelect"></select>
    </div>
    <div class="meta-field weekday">
      <label>星期標籤</label>
      <select id="weekdaySelect"></select>
    </div>
  </div>

  <div class="add-tag-row" id="addTagRow" style="display:none;">
    <input type="text" id="newTagInput" placeholder="新增標籤...">
    <label class="add-tag-checkbox">
      <input type="checkbox" id="saveTagCheckbox" checked>
      <span>加入清單</span>
    </label>
    <button id="addTagBtn">套用</button>
  </div>

  <div class="controls" id="prayMoreLessRow" style="display:none;">
    <button class="btn pray-less" id="prayLessBtn">🔻 禱告更少</button>
    <button class="btn pray-more" id="prayMoreBtn">🔺 禱告更多</button>
  </div>

  <button class="copy-tasks-btn" id="exportToFormBtn" style="display:none;">📤 匯出到表單回覆1（並丟到原本的垃圾桶）</button>

  <textarea class="note" id="noteText" placeholder="備註" rows="10" style="display:none;"></textarea>
</div>

<div class="controls triple">
  <button class="btn prev" id="prevBtn">◀ 上一項</button>
  <button class="btn next" id="nextBtn">下一項 ▶</button>
  <button class="btn complete" id="completeBtn">✅ 完成</button>
</div>

<div class="delete-row" id="deleteRow">
  <button id="deleteBtn">🗑 刪除此項</button>
</div>

<div class="quad-actions" id="quadActionsRow" style="display:none;">
  <button class="quad-btn" id="copyToTasksBtn">📋 複製到 Tasks</button>
  <button class="quad-btn" id="addToCalendarBtn">📅 加入日曆</button>
  <button class="quad-btn" id="workdayBtn">💼 工作日</button>
  <button class="quad-btn" id="weekendBtn">🛌 週末</button>
  <button class="quad-btn" id="setWeekdayBtn">📅 平日禱告</button>
  <button class="quad-btn" id="setWeekendBtn">📅 週末禱告</button>
</div>

<div class="controls">
  <button class="btn random" id="randomBtn">🎲 隨機一項</button>
  <button class="btn speak" id="speakBtn">🔊 開始朗讀</button>
</div>

<div class="repeat-row">
  <span>每項朗讀次數：</span>
  <div class="repeat-options" id="repeatOptions">
    <button type="button" data-count="1">1 次</button>
    <button type="button" data-count="2">2 次</button>
    <button type="button" data-count="3">3 次</button>
  </div>
</div>

<div class="toggle-row">
  <label class="switch">
    <input type="checkbox" id="pureReadToggle" checked>
    <span class="slider"></span>
  </label>
  <span>純朗讀模式（不標記完成）</span>
</div>

<div class="toggle-row" id="randomOrderRow">
  <label class="switch">
    <input type="checkbox" id="randomOrderToggle" checked>
    <span class="slider"></span>
  </label>
  <span>隨機排序</span>
</div>

<div class="jump-row">
  <input type="number" id="jumpInput" placeholder="第幾項" min="1">
  <button id="jumpBtn">跳到</button>
</div>

<button class="copy-tasks-btn" id="exportAllBtn">📤 一鍵輸出目前清單所有項目</button>
<button class="copy-tasks-btn" id="openSearchBtn">🔍 關鍵字搜尋（多方禱告）</button>
<button class="copy-tasks-btn" id="mergeLinelogBtn">🔗 合併 LINE 通知待辦（同一人／群組合成一個）</button>
<button class="copy-tasks-btn" id="fixWeekdayBtn">📅 校正週清單（E週一～E週日 沒搬好時按）</button>
<button class="copy-tasks-btn" id="openBlacklistBtn">🚫 LINE 黑名單（查詢／解除）</button>

<button class="copy-tasks-btn" id="openOpLogBtn">📜 操作歷程（完成／刪除／編輯是否真的送出）</button>

<div class="danger-zone">
  <button id="openTrashBtn">🗑 查看垃圾桶（多方禱告）</button>
</div>

<div class="status" id="status"></div>

<div class="loading-overlay" id="loadingOverlay">處理中...</div>

<div class="trash-overlay" id="trashOverlay">
  <div class="trash-panel">
    <div class="trash-panel-header">
      <h2>垃圾桶（多方禱告）</h2>
      <button id="closeTrashBtn" class="trash-close-btn">✕</button>
    </div>
    <div class="trash-list" id="trashList"></div>
    <div class="trash-panel-footer">
      <button id="emptyTrashBtn" class="trash-empty-btn">🗑 清空垃圾桶</button>
    </div>
  </div>
</div>

<div class="trash-overlay" id="searchOverlay">
  <div class="trash-panel">
    <div class="trash-panel-header">
      <h2>關鍵字搜尋（多方禱告）</h2>
      <button id="closeSearchBtn" class="trash-close-btn">✕</button>
    </div>
    <div class="search-input-row">
      <input type="text" id="searchKeywordInput" placeholder="輸入關鍵字">
      <button id="searchKeywordBtn">搜尋</button>
    </div>
    <div class="trash-list" id="searchResultList"></div>
    <div class="trash-panel-footer">
      <button id="mergeSearchBtn" class="search-merge-btn">🔗 合併所選項目</button>
    </div>
  </div>
</div>

<div class="trash-overlay" id="blacklistOverlay">
  <div class="trash-panel">
    <div class="trash-panel-header">
      <h2>LINE 黑名單</h2>
      <button id="closeBlacklistBtn" class="trash-close-btn">✕</button>
    </div>
    <div class="trash-list" id="blacklistList"></div>
    <div class="trash-panel-footer">
      <div class="trash-item-meta">加入：Google Tasks 任務標題打「B名字：」（可直接勾完成），下一則 LINE 通知進來時生效</div>
    </div>
  </div>
</div>

<div class="trash-overlay" id="opLogOverlay">
  <div class="trash-panel">
    <div class="trash-panel-header">
      <h2>操作歷程</h2>
      <button id="closeOpLogBtn" class="trash-close-btn">✕</button>
    </div>
    <div class="oplog-summary" id="opLogSummary"></div>
    <div class="trash-list" id="opLogList"></div>
    <div class="trash-panel-footer">
      <button id="clearOpLogBtn" class="trash-empty-btn">清除歷程記錄</button>
    </div>
  </div>
</div>

<script>
// 主要 prayer-card 專案（多方禱告 / 為習慣禱告 / 今日待辦禱告 共用同一個部署網址）
const MULTI_API_URL = 'https://script.google.com/macros/s/AKfycbyaeqMjoNHYhTSMeu6uTCHipau8egCa72-SOWIARZJ-85GE82Bc0Audu62lQS8IEgxmyw/exec';
// dg-network 是完全獨立的另一個 Apps Script 專案（為網絡禱告）

async function apiCall(baseUrl, params, timeoutMs) {
  params._t = Date.now();
  const url = baseUrl + '?' + new URLSearchParams(params).toString();
  // Apps Script 偶爾會整個掛住不回應（尤其是 dg-network 那個獨立部署），沒有逾時的話畫面會一直卡在
  // 「載入中」等到瀏覽器自己放棄，體感非常久。這裡主動設 12 秒逾時，逾時就當失敗，讓重試機制介入。
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs || 12000);
  let res;
  try {
    res = await fetch(url, { cache: 'no-store', signal: controller.signal });
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('連線逾時（超過 ' + Math.round((timeoutMs || 12000) / 1000) + ' 秒沒有回應）');
    throw new Error('連線失敗：' + err.message);
  } finally {
    clearTimeout(timeoutId);
  }
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (parseErr) {
    // 伺服器沒有回傳JSON（通常是Google登入逾時、或Apps Script暫時性錯誤，改回傳了HTML頁面），
    // 這是「為網絡禱告偶爾匯入失敗」最常見的原因，直接顯示 parse 錯誤對使用者沒有意義
    throw new Error('伺服器回應異常，可能是登入逾時或暫時性錯誤');
  }
  if (data.error) throw new Error(data.error);
  return data;
}

// 打不到就再試幾次（Apps Script 偶爾會出現暫時性錯誤或整個掛住，尤其是 dg-network 那個獨立部署），
// 每次重試間隔拉長一點（1.2秒／2.5秒），總共試 3 次都失敗才真的算這個來源載入失敗。
async function apiCallWithRetry(baseUrl, params) {
  const logId = isWriteAction(params.action) ? opLogAdd(baseUrl, params) : null;
  const promise = isRowMutation(baseUrl, params)
    ? rowMutation(baseUrl, params, logId)
    : (opLogUpdate(logId, { state: 'sent' }), apiCallRetrying(baseUrl, params));
  if (logId) {
    promise.then(
      (data) => opLogUpdate(logId, { state: 'ok', result: data && data.newDate ? { row: data.row, newDate: data.newDate } : undefined }),
      // 頁面正在關閉時瀏覽器會中斷連線，那不代表伺服器沒做，維持原狀態，下次載入顯示「沒送出／沒等到回應」
      (err) => { if (!pageUnloading) opLogUpdate(logId, { state: 'fail', err: err && err.message }); }
    );
  }
  return promise;
}

// ===== 操作歷程：每個寫入動作（完成／刪除／編輯…）都記在 localStorage，看得到有沒有真的送到伺服器 =====
// 列號類的動作是排隊一個一個送的（見下方 rowMutation），每個要等 Apps Script 回應好幾秒；
// 連續處理幾十項時，排隊中的請求還沒送出就重新整理／關掉頁面，那些就不會生效，
// 重新整理後數字自然不會減少。這裡把每筆的狀態記下來：排隊中→已送出→成功／失敗，
// 頁面被關掉時還在「排隊中」的就是確定沒送出的，可以在歷程面板按「重送」。
const OPLOG_STORAGE_KEY = 'allHtml_opLog';
const OPLOG_MAX = 500;
const OPLOG_ACTION_LABELS = {
  completeByRow: '完成', completeTaskItem: '完成', deleteByRow: '刪除', deleteCalendarEvent: '刪除',
  updateTextByRow: '改文字', updateTaskTitle: '改文字', updateCalendarEventTitle: '改文字',
  updateCycleByRow: '改週期', updateCalendarEventCycle: '改週期', updateTagByRow: '改標籤',
  updateNoteByRow: '改備註', copyToTasks: '複製到 Tasks',
  setDateToNearestWeekday: '改到平日', setDateToNearestWeekend: '改到週末',
  exportCalendarEventToPrayerSheet: '匯出到表單回覆1', addItem: '新增到表單回覆1'
};
const OPLOG_SOURCE_LABELS = { habit: '習慣', network: '網絡', multi: '多方', task: '待辦' };

function isWriteAction(action) {
  return Object.prototype.hasOwnProperty.call(OPLOG_ACTION_LABELS, action);
}

let opLogNewlyLost = 0; // 這次載入才發現的（上次關頁面時還沒結果的），只提醒這些，不會每次重新整理都跳
function loadOpLog() {
  try {
    const list = JSON.parse(localStorage.getItem(OPLOG_STORAGE_KEY) || '[]');
    // 上次頁面關掉時還沒有結果的：排隊中＝確定沒送出，已送出＝伺服器可能有做也可能沒做
    list.forEach(e => {
      if (e.state === 'queued') { e.state = 'lost'; opLogNewlyLost++; }
      else if (e.state === 'sent') { e.state = 'unknown'; opLogNewlyLost++; }
    });
    return list;
  } catch (err) {
    return [];
  }
}
let opLog = loadOpLog();
function saveOpLog() {
  if (opLog.length > OPLOG_MAX) opLog = opLog.slice(opLog.length - OPLOG_MAX);
  try { localStorage.setItem(OPLOG_STORAGE_KEY, JSON.stringify(opLog)); } catch (err) { /* 存不進去就算了 */ }
}
saveOpLog();

// 呼叫當下從本地清單找出是哪一項（任務／行程用 id，列號類用 row；要在 rowMutation 校正列號之前找）
function findItemForParams(baseUrl, params) {
  return allItems.find(it => {
    if (params.taskId) return it.source === 'task' && it.id === params.taskId;
    if (params.eventId) return it.source === 'habit' && it.id === params.eventId;
    if (params.row !== undefined) {
      const source = baseUrl === NETWORK_API_URL ? 'network' : 'multi';
      return it.source === source && String(it.row) === String(params.row);
    }
    return false;
  });
}

function opLogAdd(baseUrl, params) {
  const item = findItemForParams(baseUrl, params);
  const isUpdate = /^update/.test(params.action);
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    t: Date.now(),
    action: params.action,
    source: item ? item.source : (params.taskId ? 'task' : params.eventId ? 'habit' : baseUrl === NETWORK_API_URL ? 'network' : 'multi'),
    text: params.expect || (item && item.text) || params.text || (isUpdate ? '' : params.value) || '',
    value: isUpdate ? String(params.value || '') : '',
    state: 'queued',
    baseUrl: baseUrl,
    params: Object.assign({}, params)
  };
  delete entry.params._t;
  opLog.push(entry);
  saveOpLog();
  updateOpLogButton();
  return entry.id;
}

function opLogUpdate(id, patch) {
  if (!id) return;
  const entry = opLog.find(e => e.id === id);
  if (!entry) return;
  Object.assign(entry, patch);
  if (patch.state === 'ok' || patch.state === 'fail') entry.doneAt = Date.now();
  saveOpLog();
  updateOpLogButton();
  if (el.opLogOverlay.classList.contains('show')) renderOpLog();
}

const OPLOG_COMPLETE_ACTIONS = new Set(['completeByRow', 'completeTaskItem']);
let loadStartedAt = 0;
function opLogVerifyLoaded(source, items) {
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
  const norm = t => String(t || '').replace(/\s+/g, ' ').trim();
  const dueTexts = new Set(items.map(it => norm(it.text)));
  const dueIds = new Set(items.map(it => it.id));
  let flagged = 0;
  opLog.forEach(e => {
    if (e.source !== source || e.state !== 'ok' || e.stillDue || !OPLOG_COMPLETE_ACTIONS.has(e.action)) return;
    if (!e.doneAt || e.doneAt < todayStart.getTime() || e.doneAt >= loadStartedAt) return;
    const stillThere = e.params && e.params.taskId ? dueIds.has(e.params.taskId) : (e.text && dueTexts.has(norm(e.text)));
    if (stillThere) { e.stillDue = Date.now(); flagged++; }
  });
  if (flagged) {
    saveOpLog();
    showStatus('有 ' + flagged + ' 筆「完成」伺服器回報成功，但重新載入後還在清單，詳見「📜 操作歷程」', true);
  }
}

function opLogPendingCount() {
  return opLog.filter(e => e.state === 'queued' || e.state === 'sent').length;
}

// 還有沒送完的就攔住重新整理／關閉頁面，不然排隊中的動作會整批消失
let pageUnloading = false;
window.addEventListener('pagehide', () => { pageUnloading = true; });
window.addEventListener('beforeunload', (e) => {
  if (opLogPendingCount() === 0) return;
  e.preventDefault();
  e.returnValue = '';
});

const OPLOG_STATE_TEXT = {
  queued: ['⏳ 排隊中', 'oplog-pending'],
  sent: ['⏳ 已送出，等回應', 'oplog-pending'],
  ok: ['✅ 成功', 'oplog-ok'],
  fail: ['❌ 失敗', 'oplog-fail'],
  lost: ['❌ 沒送出（頁面已關閉）', 'oplog-fail'],
  unknown: ['❓ 已送出但沒等到回應', 'oplog-fail']
};

function formatOpLogTime(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

// 重送只開放給「伺服器能自己找回是哪一項」的請求：多方禱告帶 expect 文字、任務／行程帶 id。
// 網絡禱告只有列號，頁面重新載入後列號可能已經變了，重送可能改到別列，所以不提供。
function opLogCanResend(entry) {
  if (entry.state !== 'lost' && entry.state !== 'fail') return false;
  const p = entry.params || {};
  return !!(p.expect || p.taskId || p.eventId);
}

function renderOpLog() {
  const pending = opLogPendingCount();
  const failed = opLog.filter(e => e.state === 'fail' || e.state === 'lost' || e.state === 'unknown' || (e.state === 'ok' && e.stillDue)).length;
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
  const todayOk = opLog.filter(e => e.state === 'ok' && e.t >= todayStart.getTime()).length;
  el.opLogSummary.textContent = '今天成功 ' + todayOk + ' 筆 · 進行中 ' + pending + ' 筆 · 失敗／沒送出 ' + failed + ' 筆'
    + '（只記錄這台裝置、這個瀏覽器的操作）';

  el.opLogList.innerHTML = '';
  if (opLog.length === 0) {
    el.opLogList.innerHTML = '<div class="trash-empty-msg">還沒有任何操作記錄</div>';
    return;
  }
  opLog.slice().reverse().forEach(entry => {
    const row = document.createElement('div');
    row.className = 'trash-item';
    const main = document.createElement('div');
    main.className = 'trash-item-main';
    const text = document.createElement('div');
    text.className = 'trash-item-text';
    text.textContent = (OPLOG_ACTION_LABELS[entry.action] || entry.action) + '｜' + (entry.text || '(無文字)')
      + (entry.value ? ' → ' + entry.value : '');
    const meta = document.createElement('div');
    meta.className = 'trash-item-meta';
    meta.textContent = formatOpLogTime(entry.t) + ' · ' + (OPLOG_SOURCE_LABELS[entry.source] || entry.source)
      + (entry.result ? ' · 下次 ' + entry.result.newDate + '（第 ' + entry.result.row + ' 列）' : '')
      + (entry.stillDue ? ' · 重新載入後仍在到期清單（' + formatOpLogTime(entry.stillDue) + ' 發現）' : '')
      + (entry.err ? ' · ' + entry.err : '');
    main.appendChild(text);
    main.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'trash-item-actions';
    const stateInfo = entry.state === 'ok' && entry.stillDue
      ? ['⚠️ 回報成功但沒生效', 'oplog-fail']
      : (OPLOG_STATE_TEXT[entry.state] || [entry.state, '']);
    const state = document.createElement('span');
    state.className = 'oplog-item-state ' + stateInfo[1];
    state.textContent = stateInfo[0];
    actions.appendChild(state);
    if (opLogCanResend(entry)) {
      const btn = document.createElement('button');
      btn.className = 'trash-restore-btn';
      btn.textContent = '重送';
      btn.addEventListener('click', () => resendOpLogEntry(entry, btn));
      actions.appendChild(btn);
    }
    row.appendChild(main);
    row.appendChild(actions);
    el.opLogList.appendChild(row);
  });
}

function resendOpLogEntry(entry, btn) {
  btn.disabled = true;
  entry.state = 'resent'; // 原本這筆不再顯示重送鈕，結果記在新的一筆
  saveOpLog();
  apiCallWithRetry(entry.baseUrl, Object.assign({}, entry.params))
    .then(() => {
      showStatus('重送成功：' + (entry.text || ''));
      loadAll(); // 重新抓清單，剛重送完成／刪除的項目才會從畫面消失
    })
    .catch(err => showStatus('重送失敗：' + err.message, true))
    .finally(renderOpLog);
}
OPLOG_STATE_TEXT.resent = ['↻ 已重送（見上方新記錄）', 'oplog-pending'];

// 上次關頁面時有沒送出／沒等到回應的，載入時提醒一次（常駐紅字，點歷程可以重送）
(function warnLostOps() {
  const lost = opLogNewlyLost;
  if (lost) showStatus('上次有 ' + lost + ' 筆操作沒有確認送出（頁面在同步完成前被關掉），請到「📜 操作歷程」查看／重送', true);
})();

el.openOpLogBtn.addEventListener('click', () => {
  renderOpLog();
  el.opLogOverlay.classList.add('show');
});
el.closeOpLogBtn.addEventListener('click', () => el.opLogOverlay.classList.remove('show'));
el.opLogOverlay.addEventListener('click', (e) => {
  if (e.target === el.opLogOverlay) el.opLogOverlay.classList.remove('show');
});
armConfirmButton(el.clearOpLogBtn, '再按一次確認清除', () => {
  // 進行中的保留，不然它們的結果回來時找不到記錄
  opLog = opLog.filter(e => e.state === 'queued' || e.state === 'sent');
  saveOpLog();
  renderOpLog();
});

// ===== 以「列號」操作試算表的請求（完成／刪除／改文字…）一律排隊，照點擊順序一個一個送 =====
// 為什麼要排隊：刪除一列後，後面所有列號都會往前移一位。以前每次點擊都立刻平行送出，
// 連點幾次刪除／完成時，Apps Script 先處理哪一個不一定，後面的請求就會對到錯的列——
// 變成「畫面顯示已刪除／已完成，其實那一列根本沒動（或動到別的列）」，重新整理後項目又跑回來。
// 做法：點擊當下就先把本地列號校正好（跟「已經刪掉」的狀態一致），請求照順序排隊，
// 每個請求排到時，伺服器的列號狀態剛好就是它點擊當下看到的狀態。
const ROW_MUTATION_ACTIONS = new Set([
  'deleteByRow', 'completeByRow', 'updateTextByRow', 'updateCycleByRow', 'updateTagByRow',
  'updateNoteByRow', 'copyToTasks', 'setDateToNearestWeekday', 'setDateToNearestWeekend'
]);
// 刪除、完成不能重試：請求逾時不代表伺服器沒做，重試可能刪到下一列／把日期推進兩次
const NO_RETRY_ACTIONS = new Set(['deleteByRow', 'completeByRow']);
const mutationQueues = {};
let mutationEpoch = 0; // 有刪除失敗就遞增，後面排隊中（列號假設已經位移）的請求全部作廢，避免對錯列

function isRowMutation(baseUrl, params) {
  return params.row !== undefined && ROW_MUTATION_ACTIONS.has(params.action)
    && (baseUrl === MULTI_API_URL || baseUrl === NETWORK_API_URL);
}

function rowMutation(baseUrl, params, logId) {
  const source = baseUrl === NETWORK_API_URL ? 'network' : 'multi';
  const row = params.row;
  const isDelete = params.action === 'deleteByRow';
  const epoch = mutationEpoch;
  if (isDelete) reindexRowsAfterDelete(source, row);

  const prev = mutationQueues[baseUrl] || Promise.resolve();
  const run = prev.then(async () => {
    if (epoch !== mutationEpoch) throw new Error('前面有一筆刪除失敗，為避免對錯列，這個動作已取消，請等清單重新載入後再操作一次');
    if (pageUnloading) throw new Error('頁面已關閉，沒有送出');
    opLogUpdate(logId, { state: 'sent' });
    // 不重試的請求只有一次機會，逾時要放寬（Apps Script 偶爾會慢到十幾秒才回，12 秒就放棄會誤判成失敗）
    const data = NO_RETRY_ACTIONS.has(params.action)
      ? await apiCall(baseUrl, Object.assign({}, params), 45000)
      : await apiCallRetrying(baseUrl, params);
    if (data && data.success === false) throw new Error('伺服器沒有處理這一列（列號無效）');
    return data;
  });
  run.catch((err) => {
    if (isDelete) {
      mutationEpoch++; // 要在後面排隊的請求開始前遞增（同一輪 microtask 內，先註冊先執行）
      scheduleResync(err && err.message);
    }
  });
  mutationQueues[baseUrl] = run.catch(() => {});
  return run;
}

// 刪除失敗後，等排隊中的請求都跑完（或作廢）再重新載入，讓本地列號回到跟試算表一致
let resyncTimer = null;
let resyncReasons = [];
function scheduleResync(reason) {
  if (reason && resyncReasons.indexOf(reason) === -1) resyncReasons.push(reason);
  clearTimeout(resyncTimer);
  resyncTimer = setTimeout(() => {
    Promise.all(Object.values(mutationQueues)).then(() => {
      // 把真正的失敗原因一併顯示，不然只看到「已重新載入」不知道為什麼
      showStatus('刪除失敗：' + resyncReasons.join('；') + '（已重新載入清單，請確認項目狀態）', true);
      resyncReasons = [];
      loadAll();
    });
  }, 500);
}

async function apiCallRetrying(baseUrl, params) {
  const delays = [0, 1200, 2500];
  let lastErr;
  for (const delay of delays) {
    if (delay) await new Promise(resolve => setTimeout(resolve, delay));
    try {
      return await apiCall(baseUrl, Object.assign({}, params));
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr;
}

function currentItem() {
  return viewItems.length ? viewItems[cachePos] : null;
}

function currentConfig() {
  const item = currentItem();
  return item ? SOURCE_CONFIG[item.source] : null;
}

// 記住上次載入失敗的來源，讓失敗狀態常駐顯示（不像 showStatus 1.8 秒就消失），
// 不然「今天剛好 0 項」跟「其實是載入失敗」在畫面上會分不出來。
let lastFailedSources = [];

// 每個來源各自打各自的 API，各自獨立、互不等待：哪個先回來就先把畫面更新出來，
// 不會因為其中一個來源（通常是 dg-network 那個獨立部署）比較慢或不穩，
// 害其他三個明明已經抓好的來源也一起卡在「載入中」動彈不得。
// 失敗的來源會自動重試（apiCallWithRetry，總共試 3 次），還是失敗才算數。
let loadGeneration = 0; // 每次 loadAll() 遞增一次，避免舊的一輪還沒回來時使用者又按了重新整理，兩輪結果互相覆蓋

function loadSource(generation, source, label, promise, normalize) {
  promise
    .then(data => {
      if (generation !== loadGeneration) return; // 這一輪已經過期，結果直接丟棄
      lastFailedSources = lastFailedSources.filter(f => f.source !== source);
      (data.items || []).forEach(raw => {
        // 跟 index.html 一致：多方禱告清單裡的「A安祺禱告／A安祺輸入」標籤項目不在這裡顯示
        if (source === 'multi' && (raw.tag === 'A安祺禱告' || raw.tag === 'A安祺輸入')) return;
        const item = Object.assign({ source }, raw);
        if (normalize) normalize(item);
        allItems.push(item);
      });
      if (source === 'multi' && data.custom) customTagsCache = data.custom;
      opLogVerifyLoaded(source, data.items || []);
      applyFilter();
    })
    .catch(err => {
      if (generation !== loadGeneration) return;
      lastFailedSources = lastFailedSources.filter(f => f.source !== source);
      lastFailedSources.push({ source, label, message: err.message });
      showStatus(label + '載入失敗：' + err.message, true);
      updateBreakdown();
    });
}

function loadAll() {
  loadGeneration++;
  loadStartedAt = Date.now();
  const generation = loadGeneration;
  allItems = [];
  lastFailedSources = [];
  viewItems = [];
  cachePos = 0;
  renderEmptyState();
  el.progress.textContent = '載入中...';

  loadSource(generation, 'habit', '習慣', apiCallWithRetry(MULTI_API_URL, { action: 'getTodayCalendarEvents' }));
  // 網絡禱告後端回傳的是 {name, cycle, note}，沒有 text 欄位，這裡補上 text = name 才能跟其他來源共用同一套卡片渲染邏輯
  loadSource(generation, 'network', '網絡', apiCallWithRetry(NETWORK_API_URL, { action: 'getAllItems' }), (item) => { item.text = item.name || ''; });
  loadSource(generation, 'multi', '多方', apiCallWithRetry(MULTI_API_URL, { action: 'getInitData' }));
  loadSource(generation, 'task', '待辦', apiCallWithRetry(MULTI_API_URL, { action: 'getTodayTasksList' }));
  tasksAllListsForDup = [];
  loadTasksAllListsForDup(generation);
}

// 跟 index.html 一致：依週期長短排序，週期空白/無法辨識的排最前面，最長排到最短
function sortItemsByCycleDesc(items) {
  const cycleIndex = (item) => {
    const idx = CYCLE_ORDER.findIndex(code => CYCLE_MAP[code] === item.cycle);
    return idx === -1 ? Infinity : idx;
  };
  items.sort((a, b) => cycleIndex(b) - cycleIndex(a));
}
function shuffleItems(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
}

// 判斷同一句話是否在別的來源也有一份（例如 Google Tasks 跟多方禱告都各自存了一筆一樣的文字），
// 讓使用者知道這兩邊其實是重複的，可以自己決定去刪掉其中一份。
// 忽略前後空白跟內文連續空白的差異（例如半形空白打了一個或兩個），其餘要完全一樣的文字才算重複。
function normalizeForDup(text) {
  return (text || '').replace(/\s+/g, ' ').trim();
}

// 「待辦」來源的卡片只抓 Google Tasks 預設清單（getTodayTasksList），使用者自己建的其他清單
// 不會變成卡片，但裡面的任務還是可能跟別的來源重複——這份清單就是「所有」Google Tasks 清單
// 的項目，只用來跟其他來源比對找重複，不會顯示成卡片本身（見 loadTasksAllListsForDup）。
let tasksAllListsForDup = [];

function findDuplicateSourceLabels(item) {
  const norm = normalizeForDup(item.text);
  if (!norm) return [];
  const labels = new Set();
  allItems.forEach(other => {
    if (other === item) return;
    if (normalizeForDup(other.text) !== norm) return;
    labels.add(SOURCE_CONFIG[other.source].label);
  });

  // 預設清單的任務已經算在上面的「待辦」來源裡了（by task id），這裡只補「預設清單以外」的重複，
  // 避免同一個 Google Tasks 項目被算兩次、提示訊息變得多餘。
  const taskIdsAlreadyCounted = new Set(
    allItems.filter(it => it.source === 'task').map(it => it.id)
  );
  tasksAllListsForDup.forEach(t => {
    if (taskIdsAlreadyCounted.has(t.taskId)) return;
    if (normalizeForDup(t.text) !== norm) return;
    labels.add('📋 Google Tasks（' + (t.listTitle || '未命名清單') + '）');
  });

  return Array.from(labels);
}

// 跟四大來源各自獨立載入一樣，失敗就算了（這份只是重複提示用的輔助資料，不影響主要卡片功能），
// 載完後重新渲染目前這張卡片，讓重複提示補上去（這份資料通常比其他四個來源晚回來）。
function loadTasksAllListsForDup(generation) {
  apiCallWithRetry(MULTI_API_URL, { action: 'getAllGoogleTasksAllLists' })
    .then(data => {
      if (generation !== loadGeneration) return;
      tasksAllListsForDup = data.items || [];
      renderFromView(cachePos);
    })
    .catch(() => { /* 比對用的輔助資料，載入失敗不影響主要卡片功能，靜默略過 */ });
}

function applyFilter() {
  viewItems = allItems.filter(it => activeSources.has(it.source));

  // 跟 index.html 一致：隨機排序開關對任何篩選都適用（多方禱告以外的來源沒有 CYCLE_MAP 週期格式，
  // 「依週期排序」對它們等於維持原順序，不影響顯示，但開關本身不限來源都能用）
  if (el.randomOrderToggle.checked) {
    shuffleItems(viewItems);
  } else {
    sortItemsByCycleDesc(viewItems);
  }

  cachePos = 0;
  renderFromView(0);
  updateBreakdown();
}

el.randomOrderToggle.addEventListener('change', () => {
  stopSpeakingIfNeeded();
  applyFilter();
});

function updateBreakdown() {
  const counts = { habit: 0, network: 0, multi: 0, task: 0 };
  allItems.forEach(it => { counts[it.source]++; });
  const failedSet = new Set(lastFailedSources.map(f => f.source));
  const countLabel = (source, icon) => failedSet.has(source) ? `${icon}⚠️載入失敗` : `${icon}${counts[source]}`;

  el.progressBreakdown.textContent =
    [countLabel('habit', '🔁'), countLabel('network', '🌐'), countLabel('multi', '🙏'), countLabel('task', '📋')].join(' ');

  if (lastFailedSources.length) {
    el.progressBreakdown.title = '點一下重新整理失敗的來源';
    el.progressBreakdown.style.cursor = 'pointer';
    el.progressBreakdown.style.color = 'var(--text-danger)';
  } else {
    el.progressBreakdown.removeAttribute('title');
    el.progressBreakdown.style.cursor = '';
    el.progressBreakdown.style.color = '';
  }
}

// 失敗來源常駐顯示，並且點一下就能重新整理全部（簡單可靠，不用再另外做「只重載單一來源」的邏輯）
el.progressBreakdown.addEventListener('click', () => {
  if (lastFailedSources.length === 0) return;
  showStatus('重新載入中...');
  loadAll();
});

function populateSelect(selectEl, values, placeholder, currentValue) {
  selectEl.innerHTML = '<option value="">' + placeholder + '</option>';
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
  selectEl.value = currentValue || '';
}

function populateTagSelect(currentTag) {
  el.tagSelect.innerHTML = '<option value="">選擇標籤</option>';
  const values = Object.values(TAG_MAP).concat(customTagsCache || []);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.tagSelect.appendChild(opt);
  });
  // 星期標籤選單本身沒有動態內容，但每次還是要重建 <option>，
  // 不然只設 .value 卻沒有對應的 option，選單會停在「選擇星期標籤」不會變化（就是回報的「不work」）
  el.weekdaySelect.innerHTML = '<option value="">選擇星期標籤</option>';
  Object.values(WEEKDAY_MAP).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.weekdaySelect.appendChild(opt);
  });
  el.weekdaySelect.value = WEEKDAY_MAP[currentTag] ? currentTag : '';
  el.tagSelect.value = WEEKDAY_MAP[currentTag] ? '' : (currentTag || '');
}

function renderFromView(pos) {
  if (viewItems.length === 0) {
    renderEmptyState();
    return;
  }
  cachePos = ((pos % viewItems.length) + viewItems.length) % viewItems.length;
  const item = viewItems[cachePos];
  const config = SOURCE_CONFIG[item.source];
  markAsSeen(item);

  el.progress.textContent = `第 ${cachePos + 1} 項 / 共 ${viewItems.length} 項`;
  el.sourceBadge.textContent = config.label;
  el.sourceBadge.className = 'source-badge ' + config.badgeClass;

  const dupLabels = findDuplicateSourceLabels(item);
  if (dupLabels.length) {
    el.dupWarning.textContent = '⚠️ 重複，也在：' + dupLabels.join('、');
    el.dupWarning.style.display = 'inline-block';
  } else {
    el.dupWarning.style.display = 'none';
  }

  el.itemText.value = item.text || '';
  el.itemText.readOnly = !config.text.editable;
  el.readonlyHint.style.display = config.text.editable ? 'none' : 'block';

  // 只有網絡禱告的備註可以編輯、內容通常也比較長，才需要一大格；其他來源備註大多是空的，
  // 顯示一個空的大格子只會把下面的按鈕往下擠，不能編輯又沒內容的話乾脆整欄隱藏。
  if (config.note.editable) {
    el.noteText.style.display = 'block';
    el.noteText.value = item.note || '';
    el.noteText.readOnly = false;
    el.noteText.rows = 10;
    el.noteText.placeholder = '備註（可直接編輯）';
  } else if (item.note) {
    el.noteText.style.display = 'block';
    el.noteText.value = item.note;
    el.noteText.readOnly = true;
    el.noteText.rows = Math.min(6, Math.max(2, item.note.split('\n').length));
  } else {
    el.noteText.style.display = 'none';
    el.noteText.value = '';
  }

  el.cycleRow.style.display = config.cycle.show ? 'flex' : 'none';
  if (config.cycle.show) {
    populateSelect(el.cycleSelect, config.cycle.options, '選擇週期', item.cycle);
    // 跟 index.html 一致：週期沒設定時用紅底醒目提示，不然「加入日曆」「禱告更多/更少」這些
    // 需要先設定週期的按鈕按下去沒反應，使用者會看不出來是因為週期是空的
    el.cycleSelect.classList.toggle('cycle-empty', !el.cycleSelect.value);
  }

  el.tagRow.style.display = config.tag.show ? 'flex' : 'none';
  el.addTagRow.style.display = config.tag.show ? 'flex' : 'none';
  if (config.tag.show) {
    populateTagSelect(item.tag);
  }

  el.completeBtn.style.display = config.complete ? 'block' : 'none';
  el.deleteRow.style.display = config.delete.show ? 'flex' : 'none';

  // 複製到Tasks/加入日曆/平日禱告/週末禱告/禱告更多/禱告更少：只有多方禱告的後端有對應 action，其他來源隱藏
  const isMulti = item.source === 'multi';
  // 「加入日曆」待辦（task）也支援：用前端產生日曆連結，不需要多方禱告的後端 action，所以待辦只顯示這一顆
  const isTask = item.source === 'task';
  el.quadActionsRow.style.display = (isMulti || isTask) ? 'flex' : 'none';
  el.workdayBtn.style.display = isTask ? '' : 'none';
  el.weekendBtn.style.display = isTask ? '' : 'none';
  [el.copyToTasksBtn, el.setWeekdayBtn, el.setWeekendBtn].forEach(b => { b.style.display = isMulti ? '' : 'none'; });
  el.prayMoreLessRow.style.display = isMulti ? 'flex' : 'none';

  // 匯出到表單回覆1：只有「習慣」「網絡」這兩個來源本來就不是表單回覆1，才需要這個「搬過去」的按鈕
  // （多方禱告本身就是表單回覆1，待辦是即時抓 Google Tasks，都不適用）
  el.exportToFormBtn.style.display = (item.source === 'habit' || item.source === 'network') ? 'block' : 'none';
}

function updateFilterButtonsUI() {
  el.filterRow.querySelectorAll('button[data-source]').forEach(btn => {

}

el.filterRow.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-source]');
  if (!btn) return;
  stopSpeakingIfNeeded();
  flushPendingSaveIfAny();

  const source = btn.dataset.source;
  if (source === 'all') {
    activeSources = new Set(ALL_SOURCES);
  } else if (activeSources.has(source)) {
    if (activeSources.size === 1) { showStatus('至少要選一個來源'); return; }
    activeSources.delete(source);

    activeSources.add(source);

  updateFilterButtonsUI();
  applyFilter();
});

// ===== 文字/備註編輯：打字停頓 1 秒後才背景送出，切項目前會先強制送出，避免存錯項目 =====
// field 是 'text' 或 'note'，兩者各自獨立的計時器/儲存邏輯，寫法共用同一套
let noteSaveTimer = null;

function fieldEditable(config, field) {
  return field === 'text' ? config.text.editable : config.note.editable;
}
function fieldSave(config, field) {
  return field === 'text' ? config.text.save : config.note.save;
}

el.itemText.addEventListener('input', () => {
  const item = currentItem();
  const config = currentConfig();
  if (!item || !config || !config.text.editable) return;
  const value = el.itemText.value;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => flushSave(item, config, 'text', value), 1000);
});

el.noteText.addEventListener('input', () => {
  const item = currentItem();
  const config = currentConfig();
  if (!item || !config || !config.note.editable) return;
  const value = el.noteText.value;
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(() => flushSave(item, config, 'note', value), 1000);
});

function flushSave(item, config, field, value) {
  // 改文字時把「改之前」的文字一起送出，後端用它確認／找回正確的列（列號可能已經位移）
  const prevValue = item[field];
  item[field] = value;
  fieldSave(config, field)(item, value, prevValue)
    .then(() => showStatus('已同步'))
    .catch(err => showStatus('同步失敗：' + err.message, true));
}

function flushPendingSaveIfAny() {
  const item = currentItem();
  const config = currentConfig();
  if (saveTimer !== null) {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (item && config && fieldEditable(config, 'text') && item.text !== el.itemText.value) {
      flushSave(item, config, 'text', el.itemText.value);
    }
  }
  if (noteSaveTimer !== null) {
    clearTimeout(noteSaveTimer);
    noteSaveTimer = null;
    if (item && config && fieldEditable(config, 'note') && item.note !== el.noteText.value) {
      flushSave(item, config, 'note', el.noteText.value);
    }
  }
}

el.cycleSelect.addEventListener('change', () => {
  const item = currentItem();
  const config = currentConfig();
  if (!item || !config || !config.cycle.show || !el.cycleSelect.value) return;
  el.cycleSelect.classList.remove('cycle-empty');
  const oldCycle = item.cycle;
  const newCycle = el.cycleSelect.value;
  const row = item.row;

  // 跟 index.html 一致：多方禱告改週期＝同時標記這項完成（這是唯一有「改週期直接完成」規則的來源，
  // 網絡禱告／習慣禱告的週期只是單純設定，改了不會標記完成）
  if (item.source === 'multi') {
    stopSpeakingIfNeeded();
    item.cycle = newCycle;
    removeItemFromLists(item);
    showStatus('週期已更新為「' + newCycle + '」，已完成');
    apiCallWithRetry(MULTI_API_URL, { action: 'updateCycleByRow', row: row, value: newCycle, expect: item.text })
      .then(() => apiCallWithRetry(MULTI_API_URL, { action: 'completeByRow', row: row, expect: item.text }))
      .catch(err => {
        // 重試 3 次都失敗，代表這項其實沒有真的完成，加回清單裡，不然畫面上顯示「已完成」
        // 但試算表其實沒改到，重新整理後這項又跑回來，會誤以為出了怪異的 bug
        showStatus('同步失敗，請檢查網路：' + err.message, true);
        allItems.push(item);
        applyFilter();
      });
    return;
  }

  item.cycle = newCycle;
  showStatus('週期同步中...');
  config.cycle.save(item, newCycle)
    .then(() => showStatus('週期已更新'))
    .catch(err => {
      // 同步失敗就把畫面上的週期改回原本的值，避免「選單顯示新週期，但試算表其實沒改到」的錯覺
      item.cycle = oldCycle;
      el.cycleSelect.value = oldCycle || '';
      el.cycleSelect.classList.toggle('cycle-empty', !oldCycle);
      showStatus('週期同步失敗，請重試一次：' + err.message, true);
    });
});

function applyTagChange(value) {
  const item = currentItem();
  const config = currentConfig();
  if (!item || !config || !config.tag.show || !value) return;
  const oldTag = item.tag;
  item.tag = value;
  showStatus('標籤同步中...');
  config.tag.save(item, value)
    .then((data) => {
      // 跟 index.html 一致：設定的標籤剛好是「星期標籤」時，後端會自動把它同步複製到對應的
      // Google Tasks 星期清單（回傳 exported=true），複製完這項在這裡就算做完了，直接丟垃圾桶
      if (data && data.exported) {
        showStatus('已複製到對應 Google Tasks 清單，並丟進垃圾桶');
        apiCallWithRetry(MULTI_API_URL, { action: 'deleteByRow', row: item.row, expect: item.text })
          .then(() => {
            removeItemFromLists(item);
          })
          .catch(err => showStatus('丟進垃圾桶失敗，請到 index.html 手動處理：' + err.message, true));
      } else if (data && data.copied) {
        showStatus('標籤已更新並複製到 Google Tasks');
      } else {
        showStatus('標籤已更新');
      }
    })
    .catch(err => {
      item.tag = oldTag;
      populateTagSelect(oldTag);
      showStatus('標籤同步失敗，請重試一次：' + err.message, true);
    });
}

// 刪除一列後，同一張試算表裡後面的列號都會往前移一位，本地暫存區要跟著校正，
// 不然之後對其他項目的操作會對錯列（只有 multi／network 是「列」的概念，habit/task 不受影響）
function reindexRowsAfterDelete(source, deletedRow) {
  allItems.forEach(it => { if (it.source === source && it.row > deletedRow) it.row -= 1; });
}

// 從畫面上移除目前這項（已經在後端處理完，這裡只負責同步本地暫存區＋重新渲染）
function removeItemFromLists(item) {
  allItems = allItems.filter(it => it !== item);
  const idx = viewItems.indexOf(item);
  if (idx !== -1) viewItems.splice(idx, 1);
  if (viewItems.length === 0) {
    renderEmptyState();
  } else {
    renderFromView(Math.min(cachePos, viewItems.length - 1));
  }
  updateBreakdown();
}

// 雙按確認：第一下只進入「待確認」狀態，CONFIRM_TIMEOUT_MS 內按第二下才真的觸發，
// 避免滑動、誤觸就直接複製到 Tasks／加入日曆／改期這種不好復原的操作
const CONFIRM_TIMEOUT_MS = 1000;
function armConfirmButton(btn, confirmText, onConfirmed) {
  let confirming = false;
  let resetTimer = null;
  const originalText = btn.textContent;
  function reset() {
    confirming = false;
    clearTimeout(resetTimer);
    btn.textContent = originalText;
  }
  btn.addEventListener('click', () => {
    if (!confirming) {
      confirming = true;
      btn.textContent = confirmText;
      resetTimer = setTimeout(reset, CONFIRM_TIMEOUT_MS);
      return;
    }
    reset();
    onConfirmed();
  });
}

// 跟 index.html 一致：本地樂觀更新，先立刻從畫面移除、瞬間有反應，API 在背景默默同步，
// 不卡「處理中」畫面。失敗才需要使用者處理，所以把項目加回來並用常駐錯誤訊息提示。

  showStatus('完成中…（等待伺服器確認）', true);

  config.complete(item).then(() => showStatus('已標記完成 ✓')).catch(err => {
    showStatus('同步失敗，請檢查網路：' + err.message, true);
    allItems.push(item);

});

el.deleteBtn.addEventListener('click', () => {

  showStatus('刪除中…（等待伺服器確認）', true);

  config.delete.run(item)
    .then(() => showStatus('已刪除 ✓'))

// ===== 以下四個功能只有「多方禱告」的後端支援，只會在 source === 'multi' 時顯示 =====

// 不管標籤目前是什麼值，都直接複製目前這項到 Google Tasks 預設清單，可重複按。
// 複製成功後這項在這裡就算完成了：一般項目丟進垃圾桶，文字開頭是 S 的項目改成只標記完成（不丟垃圾桶）。
armConfirmButton(el.copyToTasksBtn, '再按一次確認複製', () => {
  const item = currentItem();
  if (!item || item.source !== 'multi') return;
  apiCallWithRetry(MULTI_API_URL, { action: 'copyToTasks', row: item.row, expect: item.text })
    .then(async (data) => {
      if (!data || !data.copied) { showStatus('複製失敗，請稍後再試'); return; }
      if ((item.text || '').trim().startsWith('S')) {

        removeItemFromLists(item);
        showStatus('已複製到 Google Tasks 預設清單，並標記完成（S開頭不丟垃圾桶）');
      } else {
        await SOURCE_CONFIG.multi.delete.run(item);
        removeItemFromLists(item);
        showStatus('已複製到 Google Tasks 預設清單，並丟進垃圾桶');
      }
    })
    .catch(err => showStatus('複製失敗：' + err.message));
});

// 週期輸入比對放寬：完整文字（W每週）、只打中文（每週）、只打代碼（W）都可以，不分大小寫、全形半形
function resolveCycleRrule(input) {
  const t = String(input).normalize('NFKC').trim();
  if (!t) return '';
  const up = t.toUpperCase();
  for (const key of Object.keys(CYCLE_RRULE_MAP)) {
    const m = key.match(/^([A-Z0-9]+)(.+)$/);
    if (up === key.toUpperCase() || t === m[2] || up === m[1]) return CYCLE_RRULE_MAP[key];
  }
  return '';
}

// 開啟 Google 日曆新增活動：Android 用 intent 把同一個網頁網址（含 src=FT 日曆）交給 Google 日曆 APP 處理，
// APP 會依網址的 src 選 FT 日曆；沒裝 APP 或 APP 不接受時，Android 會自動退回網頁版（S.browser_fallback_url）；
// 其他裝置（電腦、iPhone）維持開網頁版。
function openCalendarEvent(webUrl, ev) {
  if (/Android/i.test(navigator.userAgent)) {
    window.location.href = 'intent://' + webUrl.replace(/^https:\/\//, '')
      + '#Intent;scheme=https;action=android.intent.action.VIEW;package=com.google.android.calendar;'
      + 'S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';end';
    return;
  }
  window.open(webUrl, '_blank');
}

// 開啟 Google Calendar 的建立活動網址，依目前這項的週期帶入對應的重複規則（RRULE）
// 「加入日曆」：週期已經設定好的話直接用；週期是空的話這裡問一次要用哪個週期，
// 只用來產生這次的日曆連結，不會寫回試算表（跟「選週期＝完成」那條規則無關，不會觸發完成）。
// 建好日曆連結後，原本的禱告（試算表／Google Tasks）保留不動，不刪除也不標記完成。
// 所有「加入日曆」新增的行程都登錄在「FT 日曆」
const FT_CALENDAR_ID = '4a3fca26ef63c8c76efbc13cac22e4320d3448f271cdd3933273b496d055146a@group.calendar.google.com';

armConfirmButton(el.addToCalendarBtn, '再按一次確認加入日曆', () => {
  const item = currentItem();
  if (!item || (item.source !== 'multi' && item.source !== 'task')) return;
  const isTask = item.source === 'task';

  // 待辦沒有週期，每次都問一次；多方禱告週期空白時才問
  let rrule = isTask ? undefined : CYCLE_RRULE_MAP[item.cycle];
  if (!rrule) {
    const options = Object.values(CYCLE_MAP);
    const input = prompt(isTask
      ? '請輸入下面其中一個週期文字，留白＝不重複（只用來產生這次的日曆連結）：\n\n' + Object.keys(CYCLE_RRULE_MAP).join('、')
      : '這項還沒有設定週期，請輸入下面其中一個週期文字，留白＝不重複（只用來產生這次的日曆連結，不會存回禱告卡片，也不會標記完成）：\n\n' + options.join('、'));
    if (input === null) return; // 使用者取消
    rrule = resolveCycleRrule(input);
    if (!rrule && input.trim()) { showStatus('沒有找到這個週期，請輸入像「每週」或「W每週」這樣的文字', true); return; }
  }

  const title = (item.text || '禱告事項').split('\n')[0].slice(0, 100) || '禱告事項';
  // 不用全天：時間取最接近現在的下一個 15 分鐘整點（例如 17:28 → 17:30），耗時 0 分鐘（開始＝結束）
  const start = new Date();
  start.setSeconds(0, 0);
  start.setMinutes(Math.ceil(start.getMinutes() / 15) * 15);
  const end = new Date(start);
  // 用 UTC 格式（結尾 Z），不管日曆設定哪個時區都會落在正確的時間
  const fmt = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: `${fmt(start)}/${fmt(end)}`,
    details: item.text || '',
    src: FT_CALENDAR_ID
  });
  if (rrule) params.set('recur', rrule);
  openCalendarEvent('https://calendar.google.com/calendar/render?' + params.toString(), { title, details: item.text || '', rrule, start, end });

  stopSpeakingIfNeeded();
  showStatus('已開啟日曆連結（原本的項目保留不動）');
});

// 「工作日」／「週末」：把這個待辦從預設清單搬到對應清單
// （工作日每週一凌晨、週末每週六凌晨由後端觸發器搬回預設清單）
function bindMoveToListButton(btn, label, action) {
  armConfirmButton(btn, '再按一次確認移到' + label, () => {
    const item = currentItem();

    stopSpeakingIfNeeded();
    clearTimeout(saveTimer);
    saveTimer = null;
    removeItemFromLists(item);
    showStatus('已移到「' + label + '」清單');
    apiCallWithRetry(MULTI_API_URL, { action: action, taskId: item.id }).catch(err => {
      showStatus('移到' + label + '失敗：' + err.message, true);

}

// 「平日禱告／週末禱告」：把到期日改到最近的平日／週末。
// 前端先算出新日期，如果換算後還是「今天或更早」就留在清單裡，否則本地立刻移除、畫面瞬間更新；
// 「已改到...」的成功訊息要等 API 真的回應成功才顯示，失敗的話把本地移除的項目放回去。
function nearestWeekdayLocal(fromDate) {
  const d = new Date(fromDate);
  const day = d.getDay();
  if (day >= 1 && day <= 5) return d;
  d.setDate(d.getDate() + (day === 6 ? 2 : 1));
  return d;
}
function nearestWeekendLocal(fromDate) {
  const d = new Date(fromDate);
  const day = d.getDay();
  if (day === 0 || day === 6) return d;
  d.setDate(d.getDate() + (6 - day));
  return d;
}
function setDueDateAndMaybeRemove(action, computeNewDate, doneMsg) {
  const item = currentItem();
  if (!item || item.source !== 'multi') return;
  stopSpeakingIfNeeded();

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const newDate = computeNewDate(today);
  const staysDue = newDate.getTime() <= today.getTime();

  if (!staysDue) removeItemFromLists(item);

  apiCallWithRetry(MULTI_API_URL, { action: action, row: item.row, expect: item.text })
    .then(() => showStatus(doneMsg))
    .catch(err => {
      showStatus('同步失敗，請重新再按一次：' + err.message, true);
      if (!staysDue) {
        allItems.push(item);
        applyFilter();
      }
    });
}
armConfirmButton(el.setWeekdayBtn, '再按一次確認改到最近平日', () => {
  setDueDateAndMaybeRemove('setDateToNearestWeekday', nearestWeekdayLocal, '已改到最近的平日');
});
armConfirmButton(el.setWeekendBtn, '再按一次確認改到最近週末', () => {
  setDueDateAndMaybeRemove('setDateToNearestWeekend', nearestWeekendLocal, '已改到最近的週末');
});

// 這個按鈕把目前這項搬過去表單回覆1（多方禱告清單），成功後才刪掉原本那邊的資料（不是複製，是搬移）。

          // 用常駐錯誤訊息提示使用者，項目留在原本清單裡讓使用者自己決定要不要再按一次刪除

// 「禱告更多／禱告更少」：把週期調整成更密集／更疏鬆的下一級，然後標記完成
el.prayMoreBtn.addEventListener('click', () => shiftCycleAndComplete(-1));
el.prayLessBtn.addEventListener('click', () => shiftCycleAndComplete(1));
function shiftCycleAndComplete(direction) {
  const item = currentItem();
  if (!item || item.source !== 'multi') return;

  const idx = CYCLE_ORDER.findIndex(code => CYCLE_MAP[code] === item.cycle);
  if (idx === -1) { showStatus('週期是空的（紅色），請先在上面選好週期才能用這個按鈕', true); return; }
  const newIdx = idx + direction;
  if (newIdx < 0) { showStatus('已經是最密集的週期了'); return; }
  if (newIdx >= CYCLE_ORDER.length) { showStatus('已經是最疏鬆的週期了'); return; }

  const newCycle = CYCLE_MAP[CYCLE_ORDER[newIdx]];
  const row = item.row;

  stopSpeakingIfNeeded();
  removeItemFromLists(item);
  showStatus('週期已調整為「' + newCycle + '」，已完成');

  apiCallWithRetry(MULTI_API_URL, { action: 'updateCycleByRow', row: row, value: newCycle, expect: item.text })
    .then(() => apiCallWithRetry(MULTI_API_URL, { action: 'completeByRow', row: row, expect: item.text }))
    .catch(err => {
      showStatus('同步失敗，請檢查網路：' + err.message, true);
      allItems.push(item);
      applyFilter();
    });
}

function loadVoices() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  zhVoice = voices.find(v => v.lang === 'zh-TW')
        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'))
        || null;
}
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speakOnePass(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis || !text || !text.trim()) { resolve(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    if (zhVoice) utter.voice = zhVoice;
    utter.rate = 0.95;
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    window.speechSynthesis.speak(utter);
  });
}

// 跟 index.html 一致：「純朗讀模式」關掉時，連禱會邊唸邊標記完成（不是只翻頁）。
// 只有這項的來源支援「完成」才會真的標記完成（habit 沒有完成概念，一律當純朗讀跳過）。
async function runAutoPlay() {
  const isPureMode = el.pureReadToggle.checked; // 記錄本次開始時的模式，中途切換不影響這次執行
  const totalAtStart = viewItems.length;
  let loopCount = 0;

  try {
    while (autoPlayActive) {
      if (viewItems.length === 0) {
        autoPlayActive = false;
        el.speakBtn.textContent = '🔊 開始朗讀';
        showStatus('今天的禱告事項都完成了 🙏');
        return;
      }

      for (let i = 0; i < repeatCount; i++) {
        if (!autoPlayActive) return;
        el.speakBtn.textContent = `⏹ 停止朗讀（${i + 1}/${repeatCount}）`;
        await speakOnePass(el.itemText.value);
      }
      if (!autoPlayActive) return;

      const item = viewItems[cachePos];
      const config = SOURCE_CONFIG[item.source];

      if (isPureMode || !config.complete) {
        // 純朗讀模式，或這個來源沒有「完成」概念（習慣禱告）：不打API、不移除，單純往下一項移動
        loopCount++;
        if (loopCount >= totalAtStart) {
          autoPlayActive = false;
          el.speakBtn.textContent = '🔊 開始朗讀';
          showStatus('本輪已唸完一遍（未標記完成）🙏');
          return;
        }
        renderFromView(cachePos + 1);
        continue;
      }

      config.complete(item).catch(err => {
        showStatus('同步失敗：' + err.message, true);
        allItems.push(item);
        applyFilter();
      });
      removeItemFromLists(item);

      if (viewItems.length === 0) {
        autoPlayActive = false;
        el.speakBtn.textContent = '🔊 開始朗讀';
        showStatus('今天的禱告事項都完成了 🙏');
        return;
      }
    }
  } finally {
    releaseWakeLock();
  }
}

let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) { /* 裝置不支援，忽略 */ }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (err) { /* 忽略 */ }
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && autoPlayActive && !wakeLock) {
    requestWakeLock();
  }
});

el.speakBtn.addEventListener('click', () => {
  if (autoPlayActive) {
    autoPlayActive = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    el.speakBtn.textContent = '🔊 開始朗讀';
    releaseWakeLock();
    return;
  }
  if (viewItems.length === 0) { showStatus('目前沒有待代禱的項目'); return; }
  autoPlayActive = true;
  requestWakeLock();
  runAutoPlay();
});

function stopSpeakingIfNeeded() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (autoPlayActive) {
    autoPlayActive = false;
    el.speakBtn.textContent = '🔊 開始朗讀';
    releaseWakeLock();
  }
}

function formatTrashTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderTrashList(items) {
  el.trashList.innerHTML = '';
  if (!items || items.length === 0) {
    el.trashList.innerHTML = '<div class="trash-empty-msg">垃圾桶是空的</div>';
    return;
  }
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'trash-item';

    const main = document.createElement('div');
    main.className = 'trash-item-main';
    const text = document.createElement('div');
    text.className = 'trash-item-text';
    text.textContent = item.text || '（空白）';
    const meta = document.createElement('div');
    meta.className = 'trash-item-meta';
    meta.textContent = formatTrashTime(item.deletedAt) + (item.cycle ? '・' + item.cycle : '');
    main.appendChild(text);
    main.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'trash-item-actions';

    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'trash-restore-btn';
    restoreBtn.textContent = '↩️ 還原';
    restoreBtn.addEventListener('click', () => restoreTrashItem(item.trashRow, row));

    const delBtn = document.createElement('button');
    delBtn.className = 'trash-delete-btn';
    delBtn.textContent = '永久刪除';
    delBtn.addEventListener('click', () => permanentlyDeleteTrashItem(item.trashRow, row));

    actions.appendChild(restoreBtn);
    actions.appendChild(delBtn);

    row.appendChild(main);
    row.appendChild(actions);
    el.trashList.appendChild(row);
  });
}

async function loadTrashList() {
  el.trashList.innerHTML = '<div class="trash-empty-msg">載入中...</div>';
  try {
    const data = await apiCall(MULTI_API_URL, { action: 'getTrashList' });
    renderTrashList(data.items || []);
  } catch (err) {
    el.trashList.innerHTML = '<div class="trash-empty-msg">載入失敗：' + err.message + '</div>';

}

// 把勾選的多個項目合併成一項：文字依列號由小到大用換行接起來，寫回「週期最短」的那一項，
// 其餘項目丟進垃圾桶；合併完重新整理全部來源，因為多方禱告的列號/內容可能已經變動
armConfirmButton(el.mergeSearchBtn, '再按一次確認合併', async () => {
  const checkedRows = Array.from(el.searchResultList.querySelectorAll('input[type="checkbox"]:checked'))
    .map(cb => parseInt(cb.dataset.row, 10));
  if (checkedRows.length < 2) { showStatus('請至少勾選兩項才能合併'); return; }

  const selected = searchResultsCache
    .filter(item => checkedRows.includes(item.row))
    .sort((a, b) => a.row - b.row);

  const cycleIndex = (item) => {
    const idx = CYCLE_ORDER.findIndex(code => CYCLE_MAP[code] === item.cycle);
    return idx === -1 ? Infinity : idx;
  };
  const target = selected.slice().sort((a, b) => cycleIndex(a) - cycleIndex(b) || a.row - b.row)[0];
  const others = selected.filter(item => item.row !== target.row);
  const mergedText = selected.map(item => item.text).join('；');

  setLoading(true);
  try {
    await apiCallWithRetry(MULTI_API_URL, { action: 'updateTextByRow', row: target.row, value: mergedText, expect: target.text });
    const toTrash = others.slice().sort((a, b) => b.row - a.row);
    for (const item of toTrash) {
      await apiCallWithRetry(MULTI_API_URL, { action: 'deleteByRow', row: item.row, expect: item.text });
    }
    showStatus('已合併 ' + selected.length + ' 項為一項');
    await performSearch();
    await loadAll(); // 多方禱告到期清單的列號/內容可能已變動，重新整理全部來源
  } catch (err) {
    showStatus('合併失敗：' + err.message, true);
  } finally {
    setLoading(false);
  }
});

// 執行禱告卡專案的 linelogMergeExisting()（LINE App 現在打的是禱告卡，任務是禱告卡建立的）：同一個好友／群組的多個未完成「1 …」任務合併成一個。
// 遇到頻率限制會在後端等待重試，可能跑好幾分鐘，所以逾時拉長、也不自動重試（重跑是安全的，訊息會去重）
armConfirmButton(el.mergeLinelogBtn, '再按一次確認合併', async () => {
  setLoading(true);
  // 後端每批最多跑 4.5 分鐘，還沒做完會回 more: true，這裡自動接著呼叫下一批（最多 10 批）
  const byKey = {};
  const skippedByKey = {};
  try {
    for (let batch = 1; batch <= 10; batch++) {
      el.loadingOverlay.textContent = '合併中（第 ' + batch + ' 批，已合併 ' + Object.keys(byKey).length + ' 組）...';
      const data = await apiCall(MULTI_API_URL, { action: 'mergeLinelogTasks' }, 6 * 60 * 1000);
      (data.merged || []).forEach(m => { byKey[m.key] = m; });
      (data.skipped || []).forEach(m => { skippedByKey[m.key] = m; });
      if (!data.more) break;
    }
    const merged = Object.values(byKey);
    const skipped = Object.values(skippedByKey);
    // 舊的獨立 linelog 專案建立的任務，禱告卡沒權限改／刪，會留著需要手動完成
    const leftCount = merged.reduce((n, m) => n + (m.left || 0), 0) + skipped.reduce((n, m) => n + m.count, 0);
    let msg = merged.length === 0 ? '沒有需要合併的 LINE 通知待辦'
      : '已合併 ' + merged.length + ' 組：' + merged.map(m => m.key + '（' + m.count + '→' + (1 + (m.left || 0)) + '）').join('、');
    if (leftCount > 0) msg += '；另有 ' + leftCount + ' 個任務是舊 LINE 專案建立的，沒權限改，請手動完成';
    showStatus(msg);
    await loadAll(); // 待辦來源的任務有被刪除／改備註
  } catch (err) {
    // 鎖定逾時＝上一次按的合併還在 Apps Script 背景跑（關掉頁面／逾時也不會中止，最多跑 6 分鐘）
    if (/鎖定逾時|lock timeout|timed out waiting for lock/i.test(err.message)) {
      showStatus('上一次的合併還在背景跑（最多 6 分鐘），請等幾分鐘再按一次', true);
    } else {
      showStatus('合併失敗：' + err.message + '（已合併的不會重複，可以再按一次接著做）', true);
    }
  } finally {
    el.loadingOverlay.textContent = '處理中...';
    setLoading(false);
  }
});

// 執行禱告卡的 fixWeekdayTaskLists()：補救 google-task-weekday-scheduler 漏搬的任務
// （非今天的 E週X 還在預設清單／工作區 → 搬回週X 清單；今天的週X 清單還有任務 → 搬回預設清單）。重跑是安全的
armConfirmButton(el.fixWeekdayBtn, '再按一次確認校正', async () => {
  setLoading(true);
  const movedOut = [];
  const movedBack = [];
  let failed = [];
  let today = '';
  try {
    for (let batch = 1; batch <= 5; batch++) {
      el.loadingOverlay.textContent = '校正週清單中（第 ' + batch + ' 批）...';
      const data = await apiCall(MULTI_API_URL, { action: 'fixWeekdayTaskLists' }, 6 * 60 * 1000);
      today = data.today;
      movedOut.push(...(data.movedOut || []));
      movedBack.push(...(data.movedBack || []));
      failed = data.failed || [];
      if (!data.more) break;
    }
    const parts = [];
    if (movedOut.length) parts.push('搬回週清單 ' + movedOut.length + ' 個：' + movedOut.map(m => m.title + '→' + m.to).join('、'));
    if (movedBack.length) parts.push('從「' + today + '」搬回預設清單 ' + movedBack.length + ' 個：' + movedBack.map(m => m.title).join('、'));
    if (failed.length) parts.push(failed.length + ' 個搬移失敗（可以再按一次）：' + failed.join('、'));
    showStatus(parts.length ? parts.join('；') : '週清單都正常（今天' + today + '），沒有要搬的任務', failed.length > 0);
    await loadAll(); // 待辦來源的任務可能有進出預設清單
  } catch (err) {
    showStatus('校正失敗：' + err.message + '（可以再按一次）', true);
  } finally {
    el.loadingOverlay.textContent = '處理中...';
    setLoading(false);
  }
});

// LINE 黑名單（B 前綴任務加入的名單，存在禱告卡的指令碼屬性 LINELOG_BLACKLIST）：查詢、按「解除」移出名單
function renderBlacklist(names) {
  el.blacklistList.innerHTML = '';
  if (!names || names.length === 0) {
    el.blacklistList.innerHTML = '<div class="trash-empty-msg">黑名單是空的</div>';
    return;
  }
  names.forEach(name => {
    const row = document.createElement('div');
    row.className = 'trash-item';
    const main = document.createElement('div');
    main.className = 'trash-item-main';
    const text = document.createElement('div');
    text.className = 'trash-item-text';
    text.textContent = name;
    main.appendChild(text);
    const actions = document.createElement('div');
    actions.className = 'trash-item-actions';
    const btn = document.createElement('button');
    btn.className = 'trash-restore-btn';
    btn.textContent = '解除';
    armConfirmButton(btn, '確認解除', async () => {
      btn.disabled = true;
      try {
        const data = await apiCall(MULTI_API_URL, { action: 'removeLinelogBlacklist', name: name }, 30000);
        renderBlacklist(data.names);
        showStatus('已解除：' + name + '，之後他的 LINE 訊息會再進 Google Tasks');
      } catch (err) {
        btn.disabled = false;
        showStatus('解除失敗：' + err.message, true);
      }
    });
    actions.appendChild(btn);
    row.appendChild(main);
    row.appendChild(actions);
    el.blacklistList.appendChild(row);
  });
}

async function openBlacklistPanel() {
  el.blacklistOverlay.classList.add('show');
  el.blacklistList.innerHTML = '<div class="trash-empty-msg">載入中...</div>';
  try {
    const data = await apiCall(MULTI_API_URL, { action: 'getLinelogBlacklist' });
    renderBlacklist(data.names);
  } catch (err) {
    el.blacklistList.innerHTML = '<div class="trash-empty-msg">載入失敗：' + err.message + '</div>';
  }
}
el.openBlacklistBtn.addEventListener('click', openBlacklistPanel);
el.closeBlacklistBtn.addEventListener('click', () => el.blacklistOverlay.classList.remove('show'));
el.blacklistOverlay.addEventListener('click', (e) => {
  if (e.target === el.blacklistOverlay) el.blacklistOverlay.classList.remove('show');
});

loadAll();
</script>
