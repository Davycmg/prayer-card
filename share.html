<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存到 PUSH</title>
<link rel="manifest" href="share.webmanifest">
<meta name="theme-color" content="#674ea7">
<link rel="icon" href="share-icons/icon-192.png">
<link rel="apple-touch-icon" href="share-icons/icon-192.png">
<style>
  :root {
    --purple: #674ea7; --yellow: #fff2cc; --green: #d9ead3;
    --gray-bg: #f5f5f7; --text-main: #1a1a1a; --text-sub: #666;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--gray-bg); color: var(--text-main);
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 19px; color: var(--purple); margin: 4px 0 10px; }
  .card {
    width: 100%; max-width: 480px; background: white; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 18px 16px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-sub); margin-bottom: 6px; }
  textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd;
    font-size: 16px; font-family: inherit; background: white;
  }
  #textInput { min-height: 140px; resize: vertical; }
  #noteInput { min-height: 54px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; min-width: 0; }
  .tag select { background: var(--green); }
  .cycle select { background: var(--yellow); }
  .mini {
    border: 1px solid #ccc; background: #fafafa; border-radius: 8px;
    padding: 4px 10px; font-size: 13px; color: #444;
  }
  .submit-btn {
    width: 100%; padding: 16px 0; border-radius: 12px; border: none;
    font-size: 17px; font-weight: bold; color: white; background: var(--purple);
  }
  .submit-btn:disabled { opacity: 0.5; }
  .status { margin-top: 12px; font-size: 14px; text-align: center; min-height: 20px; }
  .status.ok { color: #2e8b74; } .status.err { color: #d32f2f; }
  .done { text-align: center; padding: 24px 0 8px; }
  .done .big { font-size: 44px; }
  .done p { margin: 8px 0 18px; color: var(--text-sub); font-size: 14px; }
  .help { max-width: 480px; width: 100%; font-size: 13px; color: var(--text-sub); line-height: 1.7; margin-top: 14px; }
  .help b { color: var(--text-main); }
  .hidden { display: none !important; }
  #installBtn { margin-top: 6px; }
</style>
</head>
<body>

<h1>💬➜🙏 存到 PUSH</h1>

<div class="card">
  <form id="addForm">
    <div class="field">
      <label for="textInput">事項 <button type="button" class="mini" id="pasteBtn">📋 貼上</button></label>
      <textarea id="textInput" placeholder="從 LINE 分享過來的訊息會出現在這裡"></textarea>
    </div>
    <div class="row">
      <div class="field cycle">
        <label for="cycleSelect">週期</label>
        <select id="cycleSelect"></select>
      </div>
      <div class="field tag">
        <label for="tagSelect">標籤</label>
        <select id="tagSelect">
          <option value="">（無）</option>
          <option value="A安祺輸入">A安祺輸入</option>
          <option value="A安祺禱告">A安祺禱告</option>
          <option value="F家庭會議">F家庭會議</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="noteInput">備註</label>
      <textarea id="noteInput"></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">存到 PUSH</button>
    <div class="status" id="status"></div>
  </form>

  <div class="done hidden" id="donePanel">
    <div class="big">✅</div>
    <div>已存到 PUSH<span id="doneRow"></span></div>
    <p>可以直接按返回鍵回到 LINE</p>
    <button type="button" class="submit-btn" id="againBtn">再存一則</button>
  </div>
</div>

<div class="help" id="help">
  <b>第一次使用（Android Chrome）：</b>用 Chrome 開這個頁面 → 右上角「⋮」→「加到主畫面」／「安裝應用程式」。<br>
  <button type="button" class="mini hidden" id="installBtn">📲 安裝「存到PUSH」</button>
  <b>之後：</b>在 LINE 長按訊息 →「分享」→「其他應用程式」→ 選「存到PUSH」→ 確認後按「存到 PUSH」。<br>
  週期、標籤會記住上一次的選擇。
</div>

<script>
// 跟 add-item.html／home.html 同一個禱告卡 Apps Script 部署網址（doPost 的 addItem 不用金鑰）
const API_URL = 'https://script.google.com/macros/s/AKfycbyaeqMjoNHYhTSMeu6uTCHipau8egCa72-SOWIARZJ-85GE82Bc0Audu62lQS8IEgxmyw/exec';
const PREF_KEY = 'shareHtml_prefs';
const PENDING_KEY = 'shareHtml_pending';   // 送失敗的先存著，下次打開自動重送

const CYCLES = ['D每天', '2每兩天', '3每三天', '4每四天', '5每五天', 'W每週', 'DW每兩週',
  'M每月', '2M每兩個月', 'S每季', 'HY每半年', 'Y每年', '3Y每三年', '10Y每十年'];

const $ = (id) => document.getElementById(id);
const el = {
  form: $('addForm'), text: $('textInput'), cycle: $('cycleSelect'), tag: $('tagSelect'),
  note: $('noteInput'), submit: $('submitBtn'), status: $('status'),
  done: $('donePanel'), doneRow: $('doneRow'), again: $('againBtn'),
  paste: $('pasteBtn'), install: $('installBtn'), help: $('help')
};

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

CYCLES.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; el.cycle.appendChild(o); });
const prefs = lsGet(PREF_KEY, {});
el.cycle.value = CYCLES.includes(prefs.cycle) ? prefs.cycle : 'M每月';
el.tag.value = prefs.tag || '';
if (el.tag.value !== (prefs.tag || '')) el.tag.value = '';

// 分享進來的內容：LINE 通常放在 text；有些 App 會另外帶 title／url
function sharedText() {
  const p = new URLSearchParams(location.search);
  const parts = [p.get('title'), p.get('text'), p.get('url')]
    .map(s => (s || '').trim()).filter(Boolean);
  // title 跟 text 重複時只留一份
  return parts.filter((s, i) => !parts.slice(0, i).some(prev => prev.includes(s))).join('\n');
}
const incoming = sharedText();
if (incoming) {
  el.text.value = incoming;
  el.help.classList.add('hidden');
  // 網址列清掉參數，重新整理不會又帶進同一則
  history.replaceState(null, '', location.pathname);
}

function showStatus(msg, ok) { el.status.textContent = msg; el.status.className = 'status ' + (ok ? 'ok' : 'err'); }

async function postItem(item) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    // text/plain 避免 CORS 預檢（Apps Script 不回應 OPTIONS）
    const res = await fetch(API_URL, {
      method: 'POST', body: JSON.stringify(Object.assign({ action: 'addItem' }, item)),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  } finally { clearTimeout(timer); }
}

el.form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const item = {
    text: el.text.value.trim(), cycle: el.cycle.value,
    tag: el.tag.value, note: el.note.value.trim()
  };
  if (!item.text) { showStatus('請填寫事項', false); return; }
  lsSet(PREF_KEY, { cycle: item.cycle, tag: item.tag });

  el.submit.disabled = true;
  showStatus('存檔中…', true);
  try {
    const r = await postItem(item);
    el.doneRow.textContent = r.row ? `（第 ${r.row} 列）` : '';
    el.form.classList.add('hidden');
    el.done.classList.remove('hidden');
  } catch (err) {
    const pending = lsGet(PENDING_KEY, []);
    pending.push(item);
    lsSet(PENDING_KEY, pending);
    showStatus('存檔失敗（' + (err.name === 'AbortError' ? '逾時' : err.message) + '）。已先記在這台手機，下次打開會自動重送。', false);
  } finally {
    el.submit.disabled = false;
  }
});

el.again.addEventListener('click', () => {
  el.text.value = ''; el.note.value = ''; showStatus('', true);
  el.done.classList.add('hidden'); el.form.classList.remove('hidden');
  el.text.focus();
});

el.paste.addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (t) el.text.value = el.text.value ? el.text.value + '\n' + t : t;
  } catch (e) { showStatus('無法讀取剪貼簿，請長按文字框貼上', false); }
});

// 之前送失敗的，打開時依序重送
(async function flushPending() {
  const pending = lsGet(PENDING_KEY, []);
  if (!pending.length) return;
  const left = [];
  for (const item of pending) {
    try { await postItem(item); } catch (e) { left.push(item); }
  }
  lsSet(PENDING_KEY, left);
  const sent = pending.length - left.length;
  if (sent && !el.status.textContent) showStatus(`已補送之前沒存成功的 ${sent} 則` + (left.length ? `，還有 ${left.length} 則失敗` : ''), !left.length);
})();

// 可安裝時顯示安裝鈕
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e; el.install.classList.remove('hidden');
});
el.install.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
  el.install.classList.add('hidden');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('share-sw.js', { scope: './share.html' }).catch(() => {});
}
</script>
</body>
</html>
