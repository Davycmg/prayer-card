<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>代禱表單</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <style>
    body {
      font-family: 'Roboto', 'Noto Sans TC', sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 0 16px;
      color: #333;
    }
    h2 { color: #4a3b8f; margin-bottom: 4px; }
    p.desc { color: #777; font-size: 13px; margin-top: 0; }
    label { display: block; margin-top: 16px; font-weight: 500; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      margin-top: 20px;
      padding: 10px 24px;
      background: #4a3b8f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 14px; }
    #hint { font-size: 12px; color: #4a3b8f; margin-top: 6px; min-height: 16px; }
  </style>
</head>
<body>
  <h2>代禱表單</h2>
  <p class="desc">輸入姓名後若已有紀錄，會自動帶出舊資料供你編輯</p>

  <label>姓名</label>
  <input type="text" id="name" onblur="lookup()" placeholder="可用半形逗點「,」分隔多人，例如：小明,小華">
  <div id="hint"></div>

  <label>DG 週期</label>
  <select id="cycle">
    <option value="">請選擇</option>
    <option value="每天">每天</option>
    <option value="每兩天">每兩天</option>
    <option value="每三天">每三天</option>
    <option value="每四天">每四天</option>
    <option value="每五天">每五天</option>
    <option value="每週">每週</option>
    <option value="每兩週">每兩週</option>
    <option value="每月">每月</option>
    <option value="每兩個月">每兩個月</option>
    <option value="每季">每季</option>
    <option value="每半年">每半年</option>
    <option value="每年">每年</option>
  </select>

  <label>備註</label>
  <textarea id="note" placeholder="選填"></textarea>

  <button onclick="submitForm()" id="submitBtn">送出</button>
  <div id="status"></div>

  <script>
    let matchedRows = []; // 單人查詢時記住抓到的同名列號，送出時要一併帶回去（供合併/更新）

    // 確保 select 裡有這個值對應的 option，沒有的話動態補上（容錯：全形/半形括號、多餘空白等差異）
    function ensureOptionExists(selectEl, value) {
      if (!value) return;
      const exists = Array.prototype.some.call(selectEl.options, function(opt) {
        return opt.value === value;
      });
      if (!exists) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.text = value + '（原始資料，建議確認後改選標準選項）';
        selectEl.appendChild(opt);
      }
    }

    // 把輸入框內容用半形逗點拆成姓名清單，去除空白與重複
    function parseNames() {
      const raw = document.getElementById('name').value;
      const names = [];
      raw.split(',').forEach(function(part) {
        const name = part.trim();
        if (name && names.indexOf(name) === -1) names.push(name);
      });
      return names;
    }

    function lookup() {
      const names = parseNames();
      const hint = document.getElementById('hint');
      const cycleSelect = document.getElementById('cycle');
      matchedRows = [];

      if (names.length === 0) { hint.innerText = ''; return; }

      // 只輸入一位姓名：查詢並帶出過去的代禱事項供編輯／合併
      if (names.length === 1) {
        hint.innerText = '查詢中...';
        google.script.run
          .withSuccessHandler(function(res) {
            if (res) {
              matchedRows = res.rows;
              document.getElementById('note').value = res.note;

              const rowDetail = res.rowCycles
                .map(function(c, idx) { return '第' + (idx + 1) + '筆：' + c; })
                .join('｜');

              if (res.cycles.length === 1) {
                ensureOptionExists(cycleSelect, res.cycles[0]);
                cycleSelect.value = res.cycles[0];
                hint.innerText = '找到 ' + res.rows.length + ' 筆過去的代禱事項（' + rowDetail + '），已帶出舊備註，送出後將整併為 1 筆並更新';
              } else if (res.cycles.length > 1) {
                cycleSelect.value = '';
                hint.innerText = '找到 ' + res.rows.length + ' 筆過去的代禱事項（' + rowDetail + '），週期不一致，請選擇正確週期後送出';
              } else {
                cycleSelect.value = '';
                hint.innerText = '找到 ' + res.rows.length + ' 筆過去的代禱事項（' + rowDetail + '），尚未設定週期，請選擇';
              }
            } else {
              cycleSelect.value = '每月';
              document.getElementById('note').value = '';
              hint.innerText = '查無舊資料，送出後將新增一筆';
            }
          })
          .withFailureHandler(function(err) {
            hint.innerText = '查詢失敗：' + err.message;
          })
          .lookupByName(names[0]);
        return;
      }

      // 多人輸入：已有舊資料的人維持不變，只新增查無資料的人
      hint.innerText = '查詢中...';
      google.script.run
        .withSuccessHandler(function(results) {
          const existingNames = results.filter(function(r) { return r.existing; }).map(function(r) { return r.name; });
          const newNames = results.filter(function(r) { return !r.existing; }).map(function(r) { return r.name; });

          if (existingNames.length > 0 && newNames.length === 0) {
            hint.innerText = '「' + existingNames.join('、') + '」都已有舊資料，送出後不會變動，只是提醒（本表單不會更新既有資料）';
          } else if (existingNames.length > 0 && newNames.length > 0) {
            hint.innerText = '「' + existingNames.join('、') + '」已有舊資料，送出後不變動；「' + newNames.join('、') + '」尚無資料，送出後將新增';
          } else {
            hint.innerText = '「' + newNames.join('、') + '」查無舊資料，送出後將新增';
          }

          if (!cycleSelect.value) cycleSelect.value = '每月';
        })
        .withFailureHandler(function(err) {
          hint.innerText = '查詢失敗：' + err.message;
        })
        .lookupByNames(names);
    }

    function submitForm() {
      const names = parseNames();
      const cycle = document.getElementById('cycle').value;
      const statusEl = document.getElementById('status');

      if (names.length === 0) {
        statusEl.innerText = '請輸入姓名';
        return;
      }
      if (!cycle) {
        statusEl.innerText = '請選擇 DG 週期';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      statusEl.innerText = '送出中...';

      // 單人：沿用舊資料合併／更新邏輯
      if (names.length === 1) {
        const data = {
          name: names[0],
          cycle: cycle,
          note: document.getElementById('note').value,
          rows: matchedRows
        };
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.status === 'updated') {
              statusEl.innerText = res.mergedCount > 1
                ? '已將 ' + res.mergedCount + ' 筆資料整併為 1 筆並更新！'
                : '已更新原紀錄！';
            } else {
              statusEl.innerText = '已新增資料！';
            }
            btn.disabled = false;
          })
          .withFailureHandler(function(err) {
            statusEl.innerText = '發生錯誤：' + err.message;
            btn.disabled = false;
          })
          .submitForm(data);
        return;
      }

      // 多人：已有舊資料的人不動，只新增查無資料的人
      const data = {
        names: names,
        cycle: cycle,
        note: document.getElementById('note').value
      };
      google.script.run
        .withSuccessHandler(function(res) {
          let msg = '';
          if (res.created.length > 0) msg += '已新增：' + res.created.join('、') + '。';
          if (res.skipped.length > 0) msg += '已有舊資料未變動：' + res.skipped.join('、') + '。';
          if (!msg) msg = '沒有可新增的姓名。';
          statusEl.innerText = msg;
          btn.disabled = false;
        })
        .withFailureHandler(function(err) {
          statusEl.innerText = '發生錯誤：' + err.message;
          btn.disabled = false;
        })
        .submitFormMulti(data);
    }
  </script>
</body>
</html>
