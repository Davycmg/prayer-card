<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>代禱卡片</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙏</text></svg>">
<style>
  :root {
    --purple: #3d4a5c;
    --green: #3d7a68;
    --yellow: #e6d9c8;
    --gray-bg: #f0f1f2;
    --text-main: #2a2f36;
    --text-sub: #6b7280;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--gray-bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .header { width: 100%; max-width: 480px; text-align: center; padding: 12px 0; }
  .header h1 { font-size: 20px; color: var(--purple); margin: 0; }
  .progress { font-size: 14px; color: var(--text-sub); margin-top: 4px; }
  .card {
    width: 100%; max-width: 480px; background: white; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px 20px; margin-top: 12px;
  }
  .name { font-size: 18px; font-weight: bold; color: var(--purple); margin-bottom: 12px; }
  .prayer-text {
    font-size: 20px; line-height: 1.6; min-height: 140px; white-space: pre-wrap;
    outline: none; border: none; width: 100%; background: transparent;
    font-family: inherit; resize: none; color: var(--text-main);
  }
  .prayer-text:focus { background: #fafafa; border-radius: 8px; }
  .meta-row { margin-top: 16px; }
  .meta-field label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  .meta-field select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;
    font-size: 15px; background: var(--yellow);
  }
  .controls { width: 100%; max-width: 480px; display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; padding: 16px 0; border-radius: 12px; border: none; font-size: 17px;
    font-weight: bold; color: white; background: var(--purple); cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .btn:active { opacity: 0.7; }
  .btn.secondary { background: var(--green); }
  .btn.complete { background: #2e8b74; }
  .controls.triple { gap: 6px; }
  .controls.triple .btn { font-size: 14px; padding: 14px 2px; }
  .jump-row {
    width: 100%; max-width: 480px; display: flex; align-items: center;
    gap: 8px; margin-top: 14px; justify-content: center;
  }
  .jump-row input {
    width: 70px; padding: 8px; text-align: center; border-radius: 8px;
    border: 1px solid #ddd; font-size: 15px;
  }
  .jump-row button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--purple);
    background: white; color: var(--purple); font-size: 14px;
  }
  .status { margin-top: 10px; font-size: 12px; color: var(--text-sub); height: 16px; text-align: center; }
  .danger-zone {
    width: 100%; max-width: 480px; margin-top: 48px; padding-top: 16px;
    border-top: 1px solid #e5e5e5; display: flex; justify-content: center;
  }
  .danger-zone button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid #ddd;
    background: transparent; color: #b0413e; font-size: 13px; opacity: 0.6;
  }
  .danger-zone button:active { opacity: 1; }
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.7);
    align-items: center; justify-content: center; font-size: 15px; color: var(--purple); display: none;
  }
  .loading-overlay.show { display: flex; }
</style>
</head>
<body>

<div class="header">
  <h1>🙏 代禱卡片</h1>
  <div class="progress" id="progress">載入中...</div>
</div>

<div class="card">
  <div class="name" id="nameDisplay"></div>
  <textarea class="prayer-text" id="noteText" placeholder="代禱內容..."></textarea>

  <div class="meta-row">
    <div class="meta-field">
      <label>DG 週期</label>
      <select id="cycleSelect"></select>
    </div>
  </div>
</div>

<div class="controls triple">
  <button class="btn secondary" id="prevBtn">◀ 上一項</button>
  <button class="btn" id="nextBtn">下一項 ▶</button>
  <button class="btn complete" id="completeBtn">✅ 完成</button>
</div>

<div class="controls">
  <button class="btn secondary" id="randomBtn">🎲 隨機一項</button>
  <button class="btn" id="speakBtn" style="background: var(--purple);">🔊 開始連禱</button>
</div>

<label style="display:flex; align-items:center; gap:6px; font-size:13px; color:#666; max-width:480px; width:100%; margin-top:8px;">
  <input type="checkbox" id="pureReadToggle" checked>
  純朗讀模式（只播放不標記完成，不會推進代禱日期）
</label>

<div class="jump-row">
  <input type="number" id="jumpInput" placeholder="第幾項" min="1">
  <button id="jumpBtn">跳到</button>
</div>

<div class="status" id="status"></div>

<div class="danger-zone">
  <button id="deleteBtn">🗑 刪除此項</button>
</div>

<div class="loading-overlay" id="loadingOverlay">處理中...</div>

<script>
// 這個網頁是透過 Apps Script doGet 直接送出的，API 打回自己這個部署網址即可
const API_URL = '<?= apiUrl ?>';

const CYCLE_LIST = ['每天','每兩天','每三天','每四天','每五天','每週','每兩週','每月','每兩個月','每季','每半年','每年'];
const CYCLE_MAP = {
  'D': '每天', '2': '每兩天', '3': '每三天', '4': '每四天', '5': '每五天', 'W': '每週', 'DW': '每兩週',
  'M': '每月', '2M': '每兩個月', 'S': '每季', 'HY': '每半年', 'Y': '每年'
};

// ===== 本地暫存區：一次抓好今天的清單，之後翻頁/隨機/跳項都用這份資料，不用再打API =====
let itemsCache = [];   // [{row, name, cycle, note}, ...]
let cachePos = 0;      // 目前指到 itemsCache 的第幾個（0-based）
let saveTimer = null;

const el = {
  progress: document.getElementById('progress'),
  nameDisplay: document.getElementById('nameDisplay'),
  noteText: document.getElementById('noteText'),
  cycleSelect: document.getElementById('cycleSelect'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  completeBtn: document.getElementById('completeBtn'),
  randomBtn: document.getElementById('randomBtn'),
  speakBtn: document.getElementById('speakBtn'),
  jumpInput: document.getElementById('jumpInput'),
  jumpBtn: document.getElementById('jumpBtn'),
  deleteBtn: document.getElementById('deleteBtn'),
  pureReadToggle: document.getElementById('pureReadToggle'),
  status: document.getElementById('status'),
  loadingOverlay: document.getElementById('loadingOverlay')
};

function populateCycleSelect() {
  el.cycleSelect.innerHTML = '<option value="">選擇週期</option>';
  CYCLE_LIST.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    el.cycleSelect.appendChild(opt);
  });
}

function setLoading(show) { el.loadingOverlay.classList.toggle('show', show); }
function showStatus(msg) {
  el.status.textContent = msg;
  setTimeout(() => { el.status.textContent = ''; }, 1800);
}

async function apiCall(params) {
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (parseErr) {
    // 伺服器沒有回傳JSON（通常是Google登入逾時或暫時性錯誤，回傳了HTML頁面），
    // 直接顯示原始parse錯誤對使用者沒有意義，改成可理解、可行動的訊息
    throw new Error('伺服器回應異常，可能是登入逾時，請重新整理頁面再試一次');
  }
  if (data.error) throw new Error(data.error);
  return data;
}

// 從本地暫存區渲染畫面（不打API，瞬間完成）
function renderFromCache(pos) {
  if (itemsCache.length === 0) { renderEmptyState(); return; }
  cachePos = ((pos % itemsCache.length) + itemsCache.length) % itemsCache.length;
  const item = itemsCache[cachePos];

  el.progress.textContent = `第 ${cachePos + 1} 項 / 共 ${itemsCache.length} 項`;
  el.nameDisplay.textContent = item.name || '';
  el.noteText.value = item.note || '';
  el.cycleSelect.value = item.cycle || '';
}

function renderEmptyState() {
  el.progress.textContent = '第 0 項 / 共 0 項';
  el.nameDisplay.textContent = '';
  el.noteText.value = '🎉 今天沒有需要代禱的事項';
  el.cycleSelect.value = '';
}

// 初始載入：一次抓好整份今日待代禱清單
async function loadAllItems() {
  setLoading(true);
  try {
    const data = await apiCall({ action: 'getAllItems' });
    itemsCache = data.items || [];
    cachePos = 0;
    renderFromCache(0);
  } catch (err) {
    showStatus('載入失敗：' + err.message);
  } finally {
    setLoading(false);
  }
}

async function init() {
  populateCycleSelect();
  await loadAllItems();
}

// ===== 翻頁：純本地操作，不打API，瞬間完成 =====
el.prevBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();
  renderFromCache(cachePos - 1);
});

el.randomBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();
  renderFromCache(Math.floor(Math.random() * itemsCache.length));
});

el.jumpBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) { showStatus('目前沒有待代禱的項目'); return; }
  const val = parseInt(el.jumpInput.value, 10);
  if (!val || val < 1) { showStatus('請輸入有效項次'); return; }
  renderFromCache(val - 1);
  el.jumpInput.value = '';
});

// 「下一項」= 純翻頁，不呼叫API、不標記完成、不影響F/G欄
el.nextBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();
  renderFromCache(cachePos + 1);
});

// 「完成」= 標記目前這項完成：本地立刻移除、畫面瞬間更新，API在背景默默同步，不卡畫面
el.completeBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();

  const item = itemsCache[cachePos];
  itemsCache.splice(cachePos, 1);

  if (itemsCache.length === 0) {
    renderEmptyState();
  } else {
    renderFromCache(cachePos); // 移除後原位置自然遞補成下一項
  }

  apiCall({ action: 'completeByRow', row: item.row }).catch(err => {
    showStatus('同步失敗，請檢查網路：' + err.message);
  });
});

// 刪除：需要等API確認成功（避免列號校正錯誤），但只有這個動作會等待
el.deleteBtn.addEventListener('click', async () => {
  if (itemsCache.length === 0) return;
  const item = itemsCache[cachePos];
  const preview = (item.note || item.name || '').slice(0, 20);
  const confirmed = window.confirm(
    '確定要刪除「' + (item.name || '這一項') + '」嗎？\n\n' + preview + '\n\n這個動作無法復原。'
  );
  if (!confirmed) return;

  stopSpeakingIfNeeded();
  setLoading(true);
  try {
    await apiCall({ action: 'deleteByRow', row: item.row });

    const deletedRow = item.row;
    itemsCache.splice(cachePos, 1);
    // 刪除後，伺服器上這一列之後的列號都會往前移一位，本地暫存區同步校正，避免後續操作對錯列
    itemsCache.forEach(it => { if (it.row > deletedRow) it.row -= 1; });

    if (itemsCache.length === 0) {
      renderEmptyState();
    } else {
      renderFromCache(cachePos);
    }
    showStatus('已刪除');
  } catch (err) {
    showStatus('刪除失敗：' + err.message);
  } finally {
    setLoading(false);
  }
});

// 備註編輯 → 本地暫存同步更新 + 背景同步API（打字後停頓1秒才送出）
el.noteText.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (itemsCache.length === 0) return;
    const item = itemsCache[cachePos];
    item.note = el.noteText.value;
    apiCall({ action: 'updateNoteByRow', row: item.row, value: item.note })
      .then(() => showStatus('已同步'))
      .catch(err => showStatus('同步失敗：' + err.message));
  }, 1000);
});

el.cycleSelect.addEventListener('change', () => {
  if (!el.cycleSelect.value || itemsCache.length === 0) return;
  const item = itemsCache[cachePos];
  item.cycle = el.cycleSelect.value;
  apiCall({ action: 'updateCycleByRow', row: item.row, value: item.cycle })
    .then(() => showStatus('週期已更新'))
    .catch(err => showStatus('更新失敗：' + err.message));
});

// ===== 朗讀（連禱）功能：翻頁改成純本地操作，只有標記完成在背景打API，速度不受網路影響 =====
// ===== 螢幕保持喚醒（避免連禱途中因為太久沒碰螢幕而自動熄屏鎖定中斷）=====
// 注意：這只能防止「自動熄屏」，如果手動按電源鍵鎖屏，系統仍會強制中斷背景分頁的執行，這是手機系統層級的限制。
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) {
    // 裝置不支援或無法取得，不影響其他功能，只是連禱途中螢幕可能還是會自動熄屏
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (err) { /* 忽略 */ }
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', async () => {
  // 分頁切到背景又切回來時，有些瀏覽器會自動釋放喚醒鎖，連禱還在進行中的話嘗試重新取得
  if (document.visibilityState === 'visible' && autoPrayActive && !wakeLock) {
    await requestWakeLock();
  }
});

const REPEATS_PER_ITEM = 3;
let autoPrayActive = false;
let zhVoice = null;

function loadVoices() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  zhVoice = voices.find(v => v.lang === 'zh-TW')
        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'))
        || null;
}
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speakOnePass(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis || !text || !text.trim()) { resolve(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    if (zhVoice) utter.voice = zhVoice;
    utter.rate = 0.95; utter.pitch = 1;
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    window.speechSynthesis.speak(utter);
  });
}

async function runAutoPray() {
  const isPureMode = el.pureReadToggle.checked; // 記錄本次連禱開始時的模式，開始後中途切換不影響這次執行
  const totalAtStart = itemsCache.length;
  let loopCount = 0;

  try {
    while (autoPrayActive) {
      if (itemsCache.length === 0) {
        autoPrayActive = false;
        el.speakBtn.textContent = '🔊 開始連禱';
        showStatus('今天的代禱事項都完成了 🙏');
        return;
      }

      const textToSpeak = (el.nameDisplay.textContent ? el.nameDisplay.textContent + '。' : '') + el.noteText.value;

      for (let i = 0; i < REPEATS_PER_ITEM; i++) {
        if (!autoPrayActive) return;
        el.speakBtn.textContent = `⏹ 停止連禱（${i + 1}/${REPEATS_PER_ITEM}）`;
        await speakOnePass(textToSpeak);
      }
      if (!autoPrayActive) return;

      if (isPureMode) {
        // 純朗讀模式：不打API、不標記完成、不從清單移除，單純往下一項移動
        loopCount++;
        if (loopCount >= totalAtStart) {
          autoPrayActive = false;
          el.speakBtn.textContent = '🔊 開始連禱';
          showStatus('本輪已唸完一遍（未標記完成）🙏');
          return;
        }
        renderFromCache(cachePos + 1);
        continue;
      }

      const item = itemsCache[cachePos];
      itemsCache.splice(cachePos, 1);

      apiCall({ action: 'completeByRow', row: item.row }).catch(err => {
        showStatus('同步失敗：' + err.message);
      });

      if (itemsCache.length === 0) {
        autoPrayActive = false;
        el.speakBtn.textContent = '🔊 開始連禱';
        showStatus('今天的代禱事項都完成了 🙏');
        renderEmptyState();
        return;
      }

      renderFromCache(cachePos);
    }
  } finally {
    // 不管是正常唸完、被停止、還是發生錯誤，都確保釋放螢幕喚醒鎖
    releaseWakeLock();
  }
}

el.speakBtn.addEventListener('click', () => {
  if (autoPrayActive) {
    autoPrayActive = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    el.speakBtn.textContent = '🔊 開始連禱';
    releaseWakeLock();
    return;
  }
  autoPrayActive = true;
  requestWakeLock();
  runAutoPray();
});

function stopSpeakingIfNeeded() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (autoPrayActive) {
    autoPrayActive = false;
    el.speakBtn.textContent = '🔊 開始連禱';
    releaseWakeLock();
  }
}

init();
</script>

</body>
</html>
