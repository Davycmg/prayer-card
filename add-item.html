<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新增禱告事項</title>
<style>
  :root {
    --purple: #674ea7;
    --purple-light: #d9d2e9;
    --yellow: #fff2cc;
    --green: #d9ead3;
    --gray-bg: #f5f5f7;
    --text-main: #1a1a1a;
    --text-sub: #666666;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--gray-bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .banner {
    width: 100%;
    max-width: 480px;
    height: 140px;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 16px;
    display: block;
  }
  .header {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 12px 0;
  }
  .header h1 {
    font-size: 20px;
    color: var(--purple);
    margin: 0;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px 20px;
    margin-top: 12px;
  }
  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: 14px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .field label .required {
    color: #d32f2f;
    margin-left: 2px;
  }
  .field input[type="text"],
  .field textarea,
  .field select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 16px;
    font-family: inherit;
    background: white;
  }
  .field textarea {
    resize: vertical;
    min-height: 70px;
  }
  .field.tag select { background: var(--green); }
  .field.cycle select { background: var(--yellow); }
  .submit-btn {
    width: 100%;
    padding: 16px 0;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: var(--purple);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .submit-btn:active { opacity: 0.7; }
  .submit-btn:disabled { opacity: 0.5; }
  .status {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .status.ok { color: #2e8b74; }
  .status.err { color: #d32f2f; }
</style>
</head>
<body>

<img class="banner" alt="禱告的手（Albrecht Dürer, Praying Hands）"
  src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Albrecht_D%C3%BCrer_-_Praying_Hands%2C_1508_-_Google_Art_Project.jpg">

<div class="header">
  <h1>🙏 新增禱告事項</h1>
</div>

<div class="card">
  <form id="addForm">
    <div class="field">
      <label for="textInput">事項<span class="required">*</span></label>
      <input type="text" id="textInput" required>
    </div>

    <div class="field tag">
      <label for="tagSelect">標籤</label>
      <select id="tagSelect">
        <option value="A安祺輸入" selected>A安祺輸入</option>
      </select>
    </div>

    <div class="field cycle">
      <label for="cycleSelect">DG 週期<span class="required">*</span></label>
      <select id="cycleSelect" required></select>
    </div>

    <div class="field">
      <label for="noteInput">備註</label>
      <textarea id="noteInput"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">送出</button>
    <div class="status" id="status"></div>
  </form>
</div>

<script>
// ⚠️ 跟 index.html 用同一個 Apps Script 網頁應用程式網址
const API_URL = 'https://script.google.com/macros/s/AKfycbyaeqMjoNHYhTSMeu6uTCHipau8egCa72-SOWIARZJ-85GE82Bc0Audu62lQS8IEgxmyw/exec';

const CYCLE_MAP = {
  'D': 'D每天', '2': '2每兩天', '3': '3每三天', 'W': 'W每週', 'DW': 'DW每兩週',
  'M': 'M每月', '2M': '2M每兩個月', 'S': 'S每季', 'HY': 'HY每半年', 'Y': 'Y每年'
};

const el = {
  form: document.getElementById('addForm'),
  textInput: document.getElementById('textInput'),
  tagSelect: document.getElementById('tagSelect'),
  cycleSelect: document.getElementById('cycleSelect'),
  noteInput: document.getElementById('noteInput'),
  submitBtn: document.getElementById('submitBtn'),
  status: document.getElementById('status')
};

function populateCycleSelect() {
  el.cycleSelect.innerHTML = '<option value="">選擇</option>';
  Object.values(CYCLE_MAP).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.cycleSelect.appendChild(opt);
  });
}
populateCycleSelect();

function showStatus(msg, ok) {
  el.status.textContent = msg;
  el.status.className = 'status ' + (ok ? 'ok' : 'err');
}

async function apiCall(params) {
  params._t = Date.now();
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url, { cache: 'no-store' });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

el.form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const text = el.textInput.value.trim();
  if (!text) { showStatus('請填寫事項', false); return; }
  if (!el.cycleSelect.value) { showStatus('請選擇 DG 週期', false); return; }

  el.submitBtn.disabled = true;
  showStatus('送出中...', true);

  try {
    await apiCall({
      action: 'addItem',
      text: text,
      cycle: el.cycleSelect.value,
      note: el.noteInput.value.trim(),
      tag: el.tagSelect.value
    });
    showStatus('已新增！', true);

    // 送出後清空「事項」「備註」，方便連續新增下一筆；標籤／週期保留上一次選擇
    el.textInput.value = '';
    el.noteInput.value = '';
    el.textInput.focus();
  } catch (err) {
    showStatus('新增失敗：' + err.message, false);
  } finally {
    el.submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
