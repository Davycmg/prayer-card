name: Import 1c_A0 project (one-off, read-only clasp pull)
on:
  push:
    branches: [claude/amazing-dijkstra-ftxbmn]
    paths: ['.github/workflows/import-1c-a0.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/amazing-dijkstra-ftxbmn
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @google/clasp
      - run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
      - name: clasp pull
        run: |
          mkdir -p _import-1c-a0
          cd _import-1c-a0
          echo '{"scriptId":"1c_A0sMVRFrtbGa3hFvHUTNnB_sD-NxehM8tRa5mm6hK_Sk0cMXreGohT","rootDir":"."}' > .clasp.json
          clasp pull
          ls -la
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _import-1c-a0
          git commit -m "Import 1c_A0 project via clasp pull (temporary)"
          git push origin HEAD:claude/amazing-dijkstra-ftxbmn
