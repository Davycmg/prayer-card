<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>禱告卡片</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙏</text></svg>">
<style>
  :root {
    /* 主色（深藍灰）：標題、流程導覽、外部整合按鈕 */
    --main-primary: #3d4a5c;
    --main-primary-light: #dde1e6;
    --main-primary-light-text: #2c3644;
    /* 文字色 */
    --text-main: #2a2f36;
    --text-sub: #6b7280;
    /* 禱告控制按鈕：赭棕點綴 */
    --clay: #8a6a4e;
    --clay-light: #e6d9c8;
    --clay-light-text: #4a3728;
    /* 完成 */
    --teal: #3d7a68;
    /* 中性邊框 */
    --border: #d9dce0;
    --border-strong: #c2c6cc;
    /* 危險／警示：獨立不隨整體降飽和度 */
    --text-danger: #b0413e;
    --danger-light: #f5e0df;
    /* 背景層 */
    --gray-bg: #f0f1f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--gray-bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .header {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 12px 0;
  }
  .header h1 {
    font-size: 20px;
    color: var(--main-primary);
    margin: 0;
  }
  .progress {
    font-size: 14px;
    color: var(--text-sub);
    margin-top: 4px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px 20px;
    margin-top: 12px;
  }
  .prayer-text {
    font-size: 22px;
    line-height: 1.6;
    min-height: 140px;
    white-space: pre-wrap;
    outline: none;
    border: none;
    width: 100%;
    background: transparent;
    font-family: inherit;
    resize: none;
    color: var(--text-main);
  }
  .prayer-text:focus {
    background: var(--main-primary-light);
    border-radius: 8px;
  }
  .meta-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .meta-field {
    flex: 1;
    min-width: 130px;
  }
  .meta-field label {
    display: block;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 4px;
  }
  .meta-field select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: white;
  }
  .meta-field.cycle select { background: var(--main-primary-light); border: 1px solid var(--border-strong); }
  .meta-field.cycle select.cycle-empty {
    background: #ff8a80;
    border: 1px solid #d32f2f;
    color: #7a0000;
    font-weight: bold;
  }
  .meta-field.tag select { background: var(--main-primary-light); border: 1px solid var(--border-strong); }
  .meta-field.tag select.tag-highlight {
    background: #ff8a80;
    border: 1px solid #d32f2f;
    color: #7a0000;
    font-weight: bold;
  }
  .meta-field.weekday select { background: var(--main-primary-light); border: 1px solid var(--border-strong); }
  .note {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-sub);
    white-space: pre-wrap;
  }
  .add-tag-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .add-tag-row input[type="text"] {
    flex: 1;
    min-width: 100px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
  }
  .add-tag-checkbox {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
  }
  .add-tag-checkbox input { width: 16px; height: 16px; }
  .add-tag-row button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--main-primary);
    background: white;
    color: var(--main-primary);
    font-size: 13px;
    white-space: nowrap;
  }
  .copy-tasks-btn {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--main-primary);
    background: white;
    color: var(--main-primary);
    font-size: 14px;
    cursor: pointer;
  }
  .copy-tasks-btn:active { opacity: 0.7; }
  .quad-actions {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .quad-btn {
    flex: 1;
    min-width: 0;
    padding: 8px 2px;
    border-radius: 8px;
    border: 1px solid var(--main-primary);
    background: white;
    color: var(--main-primary);
    font-size: 11px;
    line-height: 1.3;
    cursor: pointer;
  }
  .quad-btn:active { opacity: 0.7; }
  .controls {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 16px 0;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: var(--main-primary);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:active { opacity: 0.7; }
  /* 導覽／流程控制：深藍灰深淺變化 */
  .btn.prev { background: var(--main-primary-light); color: var(--main-primary-light-text); }
  .btn.next { background: var(--main-primary); }
  .btn.complete { background: var(--teal); }
  /* 禱告控制：赭棕點綴，統一色相區隔於導覽色系 */
  .btn.pray-more { background: var(--clay); }
  .btn.pray-less { background: var(--clay-light); color: var(--clay-light-text); }
  .btn.random { background: var(--clay); }
  .btn.speak { background: var(--clay); }
  .controls.triple {
    gap: 6px;
  }
  .controls.triple .btn {
    font-size: 14px;
    padding: 14px 2px;
  }
  .jump-row {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    justify-content: center;
  }
  .jump-row input {
    width: 70px;
    padding: 8px;
    text-align: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  .jump-row button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--main-primary);
    background: white;
    color: var(--main-primary);
    font-size: 14px;
  }
  .toggle-row {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .repeat-row {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .repeat-row .repeat-options {
    display: flex;
    gap: 6px;
  }
  .repeat-row button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--main-primary);
    background: white;
    color: var(--main-primary);
    font-size: 14px;
  }
  .repeat-row button.active {
    background: var(--main-primary);
    color: white;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .2s;
    border-radius: 24px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .2s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--main-primary); }
  input:checked + .slider:before { transform: translateX(20px); }
  .status {
    margin-top: 6px;
    margin-bottom: 4px;
    font-size: 12px;
    color: var(--text-sub);
    height: 16px;
    text-align: center;
  }
  .danger-zone {
    width: 100%;
    max-width: 480px;
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .danger-zone button {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-danger);
    font-size: 13px;
    opacity: 0.6;
  }
  .danger-zone button:active { opacity: 1; }
  .danger-zone #openTrashBtn { color: var(--main-primary); }
  .delete-row {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }
  .delete-row button {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-danger);
    font-size: 13px;
    opacity: 0.6;
  }
  .delete-row button:active { opacity: 1; }
  .trash-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .trash-overlay.show { display: flex; }
  .trash-panel {
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    background: white;
    border-radius: 16px 16px 0 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .trash-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .trash-panel-header h2 {
    font-size: 17px;
    margin: 0;
    color: var(--main-primary);
  }
  .trash-close-btn {
    border: none;
    background: transparent;
    font-size: 18px;
    color: var(--text-sub);
    padding: 4px 8px;
    cursor: pointer;
  }
  .trash-list {
    overflow-y: auto;
    padding: 8px 20px;
    flex: 1;
  }
  .trash-empty-msg {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 32px 0;
  }
  .trash-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .trash-item-main {
    flex: 1;
    min-width: 0;
  }
  .trash-item-text {
    font-size: 14px;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trash-item-meta {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .trash-item-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .trash-item-actions button {
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
  }
  .trash-restore-btn {
    border: 1px solid var(--main-primary);
    background: white;
    color: var(--main-primary);
  }
  .trash-delete-btn {
    border: 1px solid var(--border);
    background: white;
    color: var(--text-danger);
  }
  .trash-panel-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }
  .search-input-row {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .search-input-row input {
    flex: 1;
    min-width: 0;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  .search-input-row button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--main-primary);
    background: white;
    color: var(--main-primary);
    font-size: 14px;
    white-space: nowrap;
  }
  .search-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .search-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .search-item-main {
    flex: 1;
    min-width: 0;
  }
  .search-item-text {
    font-size: 14px;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .search-item-meta {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .search-merge-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--main-primary);
    color: white;
    font-size: 15px;
  }
  .trash-empty-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--text-danger);
    background: white;
    color: var(--text-danger);
    font-size: 14px;
    cursor: pointer;
  }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--main-primary);
    display: none;
  }
  .loading-overlay.show { display: flex; }
</style>
</head>
<body>

<div class="header">
  <h1>🙏 禱告卡片</h1>
  <div class="progress" id="progress">載入中...</div>
</div>

<div class="status" id="status"></div>

<div class="card">
  <textarea class="prayer-text" id="prayerText" placeholder="禱告事項內容..."></textarea>

  <div class="meta-row">
    <div class="meta-field cycle">
      <label>DG 週期</label>
      <select id="cycleSelect"></select>
    </div>
    <div class="meta-field tag">
      <label>標籤</label>
      <select id="tagSelect"></select>
    </div>
  </div>

  <div class="meta-row">
    <div class="meta-field weekday">
      <label>星期標籤</label>
      <select id="weekdaySelect"></select>
    </div>
  </div>

  <div class="add-tag-row">
    <input type="text" id="newTagInput" placeholder="新增標籤...">
    <label class="add-tag-checkbox">
      <input type="checkbox" id="saveTagCheckbox" checked>
      <span>加入清單</span>
    </label>
    <button id="addTagBtn">套用</button>
  </div>

  <div class="quad-actions">
    <button class="quad-btn" id="copyToTasksBtn">📋 複製到 Tasks</button>
    <button class="quad-btn" id="addToCalendarBtn">📅 加入日曆</button>
    <button class="quad-btn" id="setWeekdayBtn">📅 平日禱告</button>
    <button class="quad-btn" id="setWeekendBtn">📅 週末禱告</button>
  </div>

  <div class="note" id="noteText"></div>
</div>

<div class="controls triple">
  <button class="btn prev" id="prevBtn">◀ 上一項</button>
  <button class="btn next" id="nextBtn">下一項 ▶</button>
  <button class="btn complete" id="completeBtn">✅ 完成</button>
</div>

<div class="delete-row">
  <button id="deleteBtn">🗑 刪除此項</button>
</div>

<div class="controls">
  <button class="btn pray-more" id="prayMoreBtn">🔺 禱告更多</button>
  <button class="btn pray-less" id="prayLessBtn">🔻 禱告更少</button>
</div>

<div class="controls">
  <button class="btn random" id="randomBtn">🎲 隨機一項</button>
  <button class="btn speak" id="speakBtn">🔊 開始連禱</button>
</div>

<div class="repeat-row">
  <span>每項朗讀次數：</span>
  <div class="repeat-options" id="repeatOptions">
    <button type="button" data-count="1">1 次</button>
    <button type="button" data-count="2">2 次</button>
    <button type="button" data-count="3">3 次</button>
  </div>
</div>

<div class="toggle-row">
  <label class="switch">
    <input type="checkbox" id="pureReadToggle" checked>
    <span class="slider"></span>
  </label>
  <span>純朗讀模式（不標記完成）</span>
</div>

<div class="jump-row">
  <input type="number" id="jumpInput" placeholder="第幾項" min="1">
  <button id="jumpBtn">跳到</button>
</div>

<button class="copy-tasks-btn" id="exportAllBtn">📤 一鍵輸出所有到期項目</button>
<button class="copy-tasks-btn" id="openSearchBtn">🔍 關鍵字搜尋</button>

<div class="danger-zone">
  <button id="openTrashBtn">🗑 查看垃圾桶</button>
</div>

<div class="loading-overlay" id="loadingOverlay">處理中...</div>

<div class="trash-overlay" id="trashOverlay">
  <div class="trash-panel">
    <div class="trash-panel-header">
      <h2>垃圾桶</h2>
      <button id="closeTrashBtn" class="trash-close-btn">✕</button>
    </div>
    <div class="trash-list" id="trashList"></div>
    <div class="trash-panel-footer">
      <button id="emptyTrashBtn" class="trash-empty-btn">🗑 清空垃圾桶</button>
    </div>
  </div>
</div>

<div class="trash-overlay" id="searchOverlay">
  <div class="trash-panel">
    <div class="trash-panel-header">
      <h2>關鍵字搜尋</h2>
      <button id="closeSearchBtn" class="trash-close-btn">✕</button>
    </div>
    <div class="search-input-row">
      <input type="text" id="searchKeywordInput" placeholder="輸入關鍵字">
      <button id="searchKeywordBtn">搜尋</button>
    </div>
    <div class="trash-list" id="searchResultList"></div>
    <div class="trash-panel-footer">
      <button id="mergeSearchBtn" class="search-merge-btn">🔗 合併所選項目</button>
    </div>
  </div>
</div>

<script>
// ⚠️ 部署 Apps Script 網頁應用程式後，把網址貼在這裡
const API_URL = 'https://script.google.com/macros/s/AKfycbyaeqMjoNHYhTSMeu6uTCHipau8egCa72-SOWIARZJ-85GE82Bc0Audu62lQS8IEgxmyw/exec';

const CYCLE_MAP = {
  'D': 'D每天', '2': '2每兩天', '3': '3每三天', '4': '4每四天', '5': '5每五天',
  'W': 'W每週', 'DW': 'DW每兩週',
  'M': 'M每月', '2M': '2M每兩個月', 'S': 'S每季', 'HY': 'HY每半年', 'Y': 'Y每年'
};
// 週期由密集到疏鬆的順序（跟 CYCLE_MAP 的 key 對應），「禱告更多／禱告更少」按鈕依這個順序調整週期
const CYCLE_ORDER = ['D', '2', '3', '4', '5', 'W', 'DW', 'M', '2M', 'S', 'HY', 'Y'];
const TAG_MAP = { 'G': 'G工作日', 'W': 'W週末', 'F': 'F家庭會議', 'A': 'A安祺禱告', 'AI': 'A安祺輸入' };
// 週期文字（跟 CYCLE_MAP 的值一致）對應 Google 日曆的 RRULE 重複規則
const CYCLE_RRULE_MAP = {
  'D每天': 'RRULE:FREQ=DAILY',
  '2每兩天': 'RRULE:FREQ=DAILY;INTERVAL=2',
  '3每三天': 'RRULE:FREQ=DAILY;INTERVAL=3',
  '4每四天': 'RRULE:FREQ=DAILY;INTERVAL=4',
  '5每五天': 'RRULE:FREQ=DAILY;INTERVAL=5',
  'W每週': 'RRULE:FREQ=WEEKLY',
  'DW每兩週': 'RRULE:FREQ=WEEKLY;INTERVAL=2',
  'M每月': 'RRULE:FREQ=MONTHLY',
  '2M每兩個月': 'RRULE:FREQ=MONTHLY;INTERVAL=2',
  'S每季': 'RRULE:FREQ=MONTHLY;INTERVAL=3',
  'HY每半年': 'RRULE:FREQ=MONTHLY;INTERVAL=6',
  'Y每年': 'RRULE:FREQ=YEARLY'
};
const WEEKDAY_MAP = {
  '週一': '週一', '週二': '週二', '週三': '週三', '週四': '週四',
  '週五': '週五', '週六': '週六', '週日': '週日'
};

// 依週期長短排序：週期空白/無法辨識的排最前面，接著是週期最長（如每年）排到最短（如每天）
function sortItemsByCycleDesc(items) {
  const cycleIndex = (item) => {
    const idx = CYCLE_ORDER.findIndex(code => CYCLE_MAP[code] === item.cycle);
    return idx === -1 ? Infinity : idx;
  };
  items.sort((a, b) => cycleIndex(b) - cycleIndex(a));
}

function populateSelect(selectEl, map, placeholder) {
  selectEl.innerHTML = '<option value="">' + placeholder + '</option>';
  Object.values(map).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

// ===== 自訂標籤（永久存在 Google Sheet 後端，所有裝置共用，重新部署網頁也不會消失） =====
let customTagsCache = []; // 從伺服器抓回來的自訂標籤清單，快取在記憶體裡

// 初次載入專用：一次 API 呼叫同時拿到「今日待辦清單」跟「標籤清單」，
// 取代原本 loadTagList() + loadAllItems() 兩次序列呼叫，省下一趟 Apps Script 網路來回（通常是初次載入最慢的部分）。
async function loadInitData() {
  setLoading(true);
  try {
    const data = await apiCall({ action: 'getInitData' });
    customTagsCache = data.custom || [];
    itemsCache = (data.items || []).filter(item => item.tag !== 'A安祺輸入' && item.tag !== 'A安祺禱告');
    sortItemsByCycleDesc(itemsCache);
    cachePos = 0;
    renderFromCache(0);
  } catch (err) {
    showStatus('載入失敗：' + err.message);
  } finally {
    setLoading(false);
  }
}

// 把內建標籤（TAG_MAP）跟自訂標籤（伺服器抓回來的）合併，一起顯示在下拉選單
function populateTagSelect() {
  el.tagSelect.innerHTML = '<option value="">選擇標籤</option>';

  Object.values(TAG_MAP).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.tagSelect.appendChild(opt);
  });

  customTagsCache
    .filter(v => !WEEKDAY_MAP[v]) // 週一～週日獨立到另一個下拉選單，不在這裡重複出現
    .forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v + '（自訂）';
      el.tagSelect.appendChild(opt);
    });
}

// 週期空白時，用醒目底色提醒需要補上週期

  el.cycleSelect.classList.toggle('cycle-empty', !el.cycleSelect.value);
}

// 標籤是 A安祺禱告 時，用醒目底色提醒
function updateTagWarning() {

}

// 一鍵輸出：把目前所有到期項目的標題（不含週期等其他屬性）組成純文字複製到剪貼簿
el.exportAllBtn.addEventListener('click', async () => {
  if (itemsCache.length === 0) { showStatus('目前沒有待禱告的項目'); return; }
  const lines = itemsCache.map((item, i) => (i + 1) + '. ' + item.text);
  const text = lines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    showStatus('已複製共 ' + itemsCache.length + ' 項到剪貼簿');
  } catch (err) {
    showStatus('複製失敗：' + err.message);
  }
});

function setLoading(show) {
  el.loadingOverlay.classList.toggle('show', show);
}

function showStatus(msg) {
  el.status.textContent = msg;
  setTimeout(() => { el.status.textContent = ''; }, 1800);
}

// 加上時間戳記參數 + cache: 'no-store'，避免瀏覽器用舊的快取回應，
// 這是造成「完成很多項後，重新整理網頁數字沒有正確減少」的根本原因。
async function apiCall(params) {
  params._t = Date.now(); // 加時間戳記，讓每次網址都不一樣，繞過快取
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url, { cache: 'no-store' }); // 明確告訴瀏覽器不要用快取
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// 從本地暫存區渲染畫面（不打API，瞬間完成）
function renderFromCache(pos) {
  if (itemsCache.length === 0) {
    renderEmptyState();
    return;
  }
  cachePos = ((pos % itemsCache.length) + itemsCache.length) % itemsCache.length;
  const item = itemsCache[cachePos];

  el.progress.textContent = `第 ${cachePos + 1} 項 / 共 ${itemsCache.length} 項`;
  el.prayerText.value = item.text || '';
  el.cycleSelect.value = item.cycle || '';
  el.tagSelect.value = WEEKDAY_MAP[item.tag] ? '' : (item.tag || '');
  el.weekdaySelect.value = WEEKDAY_MAP[item.tag] ? item.tag : '';
  el.noteText.textContent = item.note ? ('備註：' + item.note) : '';
  updateCycleWarning();
  updateTagWarning();
}

function renderEmptyState() {
  el.progress.textContent = '第 0 項 / 共 0 項';
  el.prayerText.value = '🎉 今天沒有需要禱告的事項';
  el.cycleSelect.value = '';
  el.tagSelect.value = '';
  el.weekdaySelect.value = '';
  el.noteText.textContent = '';
  updateCycleWarning();
  updateTagWarning();
}

async function init() {
  populateSelect(el.cycleSelect, CYCLE_MAP, '選擇週期');
  populateSelect(el.weekdaySelect, WEEKDAY_MAP, '選擇星期標籤');
  await loadInitData();
  populateTagSelect();
}

el.addTagBtn.addEventListener('click', async () => {
  if (itemsCache.length === 0) return;

  const newTag = el.newTagInput.value.trim();
  if (!newTag) { showStatus('請輸入標籤內容'); return; }

  const item = itemsCache[cachePos];
  item.tag = newTag;
  el.tagSelect.value = ''; // 自訂值不一定在下拉選單裡，先清空避免顯示錯亂
  el.weekdaySelect.value = '';
  const rowRef = item.row;

  // 套用到目前這項，背景同步（不阻塞畫面）
  apiCall({ action: 'updateTagByRow', row: rowRef, value: newTag })
    .then(data => {
      if (data && data.exported) {
        showStatus('已複製到對應 Google Tasks 清單');
      } else if (data && data.copied) {
        showStatus('標籤已套用並複製到 Google Tasks');
      } else {
        showStatus('標籤已套用');
      }
    })
    .catch(err => showStatus('套用失敗：' + err.message));

  // 打勾才永久收錄進標籤清單（存到 Google Sheet 後端，所有裝置共用）
  if (el.saveTagCheckbox.checked) {
    try {
      const data = await apiCall({ action: 'addCustomTag', value: newTag });
      customTagsCache = data.custom || [];
      populateTagSelect();
      el.tagSelect.value = newTag;
    } catch (err) {
      showStatus('加入清單失敗：' + err.message);
    }
  }

  el.newTagInput.value = '';
});

// 需要點兩下才會真的觸發，避免手機上滑動、誤觸就直接複製/開日曆：
// 第一下只是進入「待確認」狀態（按鈕文字換成提示），CONFIRM_TIMEOUT_MS 內點第二下才會真的執行，
// 逾時或點其他按鈕就自動還原，不會誤觸發。
const CONFIRM_TIMEOUT_MS = 1000;

function armConfirmButton(btn, confirmText, onConfirmed) {
  let confirming = false;
  let resetTimer = null;
  const originalText = btn.textContent;

  function reset() {
    confirming = false;
    clearTimeout(resetTimer);
    btn.textContent = originalText;
  }

  btn.addEventListener('click', () => {
    if (!confirming) {
      confirming = true;
      btn.textContent = confirmText;
      resetTimer = setTimeout(reset, CONFIRM_TIMEOUT_MS);
      return;
    }
    reset();
    onConfirmed();
  });
}

// 不管H欄標籤目前是什麼值，都直接複製目前這項到 Google Tasks 預設清單。
// 用來解決「標籤本來就已經是task預設清單、change事件不會觸發」的限制，可以隨時重複按。
// 確認複製成功後，這項在這邊的任務就算完成了：一般項目直接丟進垃圾桶（跟「刪除此項」共用同一套邏輯），
// 但文字開頭是 S 的項目改成只標記完成（跟「完成」按鈕一樣，會推進週期），不丟垃圾桶。
armConfirmButton(el.copyToTasksBtn, '再按一次確認複製', () => {
  if (itemsCache.length === 0) return;
  const item = itemsCache[cachePos];

  apiCall({ action: 'copyToTasks', row: item.row })
    .then(data => {
      if (data && data.copied) {
        if ((item.text || '').trim().startsWith('S')) {
          moveCurrentItemToComplete();
          showStatus('已複製到 Google Tasks 預設清單，並標記完成（S開頭不丟垃圾桶）');
        } else {
          moveCurrentItemToTrash();
          showStatus('已複製到 Google Tasks 預設清單，並丟進垃圾桶');
        }
      } else {
        showStatus('複製失敗，請稍後再試');
      }
    })
    .catch(err => showStatus('複製失敗：' + err.message));
});

// 新增到 Google 日曆：開啟 Google Calendar 的建立活動網址，依目前這項的週期帶入對應的重複規則（RRULE）
armConfirmButton(el.addToCalendarBtn, '再按一次確認加入日曆', () => {
  if (itemsCache.length === 0) return;
  const item = itemsCache[cachePos];

  const rrule = CYCLE_RRULE_MAP[item.cycle];
  if (!rrule) { showStatus('請先設定週期才能加入日曆'); return; }

  const title = (item.text || '禱告事項').split('\n')[0].slice(0, 100) || '禱告事項';

  // 用明天當第一次提醒日期，全天活動
  const start = new Date();
  start.setDate(start.getDate() + 1);
  const end = new Date(start);
  end.setDate(end.getDate() + 1);
  const fmt = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;

  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: `${fmt(start)}/${fmt(end)}`,
    details: item.text || '',
    recur: rrule
  });

  window.open('https://calendar.google.com/calendar/render?' + params.toString(), '_blank');
});

// 「平日禱告／週末禱告」：把目前這項的到期日（E欄）改到最近的平日／週末（今天符合的話就用今天）。
// 跟「完成」按鈕一樣不跳「處理中」：前端先算出新日期，如果還是「今天或更早」就留著清單裡，
// 否則本地立刻移除、畫面瞬間更新；但「已改到...」的成功訊息一定要等 API 真的回應成功才顯示——
// 不然 API 失敗時（例如還沒發布新版本、網路不穩）畫面卻顯示成功，試算表其實沒改到，
// 重新整理後這項又跑回來，會誤以為出了怪異的 bug。API 失敗時也要把本地移除的項目放回去。
function nearestWeekdayLocal(fromDate) {
  const d = new Date(fromDate);
  const day = d.getDay(); // 0=週日...6=週六
  if (day >= 1 && day <= 5) return d;
  d.setDate(d.getDate() + (day === 6 ? 2 : 1));
  return d;
}
function nearestWeekendLocal(fromDate) {
  const d = new Date(fromDate);
  const day = d.getDay();
  if (day === 0 || day === 6) return d;
  d.setDate(d.getDate() + (6 - day));
  return d;
}
function setDueDateAndMaybeRemove(action, computeNewDate, doneMsg) {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();

  const item = itemsCache[cachePos];
  const removedAt = cachePos;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const newDate = computeNewDate(today);
  const staysDue = newDate.getTime() <= today.getTime();

  if (!staysDue) {
    itemsCache.splice(cachePos, 1);
    if (itemsCache.length === 0) {
      renderEmptyState();
    } else {
      renderFromCache(cachePos);
    }
  }

  apiCall({ action: action, row: item.row })
    .then(() => showStatus(doneMsg))
    .catch(err => {
      showStatus('同步失敗，請重新再按一次：' + err.message);
      if (!staysDue) {
        itemsCache.splice(removedAt, 0, item); // 同步失敗，放回本地暫存區，不要讓項目憑空消失
        renderFromCache(removedAt);
      }
    });
}

armConfirmButton(el.setWeekdayBtn, '再按一次確認改到最近平日', () => {
  setDueDateAndMaybeRemove('setDateToNearestWeekday', nearestWeekdayLocal, '已改到最近的平日');
});

armConfirmButton(el.setWeekendBtn, '再按一次確認改到最近週末', () => {
  setDueDateAndMaybeRemove('setDateToNearestWeekend', nearestWeekendLocal, '已改到最近的週末');
});

el.prevBtn.addEventListener('click', () => {

});

el.randomBtn.addEventListener('click', () => {

  stopSpeakingIfNeeded();

el.jumpBtn.addEventListener('click', () => {

  const val = parseInt(el.jumpInput.value, 10);
  if (!val || val < 1) { showStatus('請輸入有效項次'); return; }

  el.jumpInput.value = '';
});

// 「下一項」= 純翻頁，不標記完成、不動F/E欄、不從清單移除
el.nextBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();
  renderFromCache(cachePos + 1);
});

// 「完成」= 標記目前這項完成：本地立刻移除、畫面瞬間更新，API在背景默默同步，不卡畫面
el.completeBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();

  const item = itemsCache[cachePos];
  itemsCache.splice(cachePos, 1);

  if (itemsCache.length === 0) {
    renderEmptyState();
  } else {
    renderFromCache(cachePos); // 移除後原位置自然遞補成下一項
  }

  apiCall({ action: 'completeByRow', row: item.row }).catch(err => {
    showStatus('同步失敗，請檢查網路：' + err.message);
  });
});

// 「禱告更多」「禱告更少」= 把週期調整成更密集／更疏鬆的下一級，然後完成這項（跟「完成」按鈕一樣本地立刻移除、背景同步）
// direction: -1 = 禱告更多（週期變短，例如 DW每兩週 → W每週），+1 = 禱告更少（週期變長，例如 W每週 → DW每兩週）
function shiftCycleAndComplete(direction) {
  if (itemsCache.length === 0) return;
  const item = itemsCache[cachePos];

  const idx = CYCLE_ORDER.findIndex(code => CYCLE_MAP[code] === item.cycle);
  if (idx === -1) { showStatus('請先設定週期，才能用這個按鈕調整'); return; }

  const newIdx = idx + direction;
  if (newIdx < 0) { showStatus('已經是最密集的週期了'); return; }
  if (newIdx >= CYCLE_ORDER.length) { showStatus('已經是最疏鬆的週期了'); return; }

  const newCycle = CYCLE_MAP[CYCLE_ORDER[newIdx]];
  const row = item.row;

  stopSpeakingIfNeeded();
  itemsCache.splice(cachePos, 1);

  if (itemsCache.length === 0) {
    renderEmptyState();
  } else {
    renderFromCache(cachePos); // 移除後原位置自然遞補成下一項
  }

  // 先更新週期，再標記完成：完成時後端會依「新」週期往後推算下次禱告日期
  apiCall({ action: 'updateCycleByRow', row: row, value: newCycle })
    .then(() => apiCall({ action: 'completeByRow', row: row }))
    .catch(err => showStatus('同步失敗，請檢查網路：' + err.message));

  showStatus('週期已調整為「' + newCycle + '」，已完成');
}

el.prayMoreBtn.addEventListener('click', () => shiftCycleAndComplete(-1));
el.prayLessBtn.addEventListener('click', () => shiftCycleAndComplete(1));

// 刪除＝丟進垃圾桶：不再跳確認對話框，本地立刻移除（跟「完成」按鈕一樣的優化樂觀更新），
// 背景才真的呼叫API把該列資料搬到「垃圾桶」分頁（軟刪除，可從垃圾桶還原）。
// 跟「複製到 Google Tasks」成功後自動丟垃圾桶共用同一套邏輯。
function moveCurrentItemToTrash() {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();

  const item = itemsCache[cachePos];
  const deletedRow = item.row;
  itemsCache.splice(cachePos, 1);
  // 刪除後，伺服器上這一列之後的列號都會往前移一位，本地暫存區同步校正，避免後續操作對錯列
  itemsCache.forEach(it => { if (it.row > deletedRow) it.row -= 1; });

  if (itemsCache.length === 0) {
    renderEmptyState();
  } else {
    renderFromCache(cachePos); // 移除後原位置自然遞補成下一項
  }

  apiCall({ action: 'deleteByRow', row: deletedRow }).catch(err => {
    showStatus('同步失敗，請檢查網路：' + err.message);
  });
}

el.deleteBtn.addEventListener('click', () => {
  if (itemsCache.length === 0) return;
  moveCurrentItemToTrash();
  showStatus('已丟進垃圾桶');
});

// 跟「完成」按鈕一樣的本地樂觀更新，但呼叫 completeByRow（標記完成、推進週期），不是丟垃圾桶。
// 「複製到 Tasks」按鈕遇到 S 開頭的項目時用這個，而不是 moveCurrentItemToTrash()。
function moveCurrentItemToComplete() {
  if (itemsCache.length === 0) return;
  stopSpeakingIfNeeded();

  const item = itemsCache[cachePos];
  itemsCache.splice(cachePos, 1);

  if (itemsCache.length === 0) {
    renderEmptyState();
  } else {
    renderFromCache(cachePos);
  }

  apiCall({ action: 'completeByRow', row: item.row }).catch(err => {
    showStatus('同步失敗，請檢查網路：' + err.message);
  });
}

// ===== 垃圾桶：批次查看／還原／永久刪除／清空 =====
function formatTrashTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderTrashList(items) {
  el.trashList.innerHTML = '';
  if (!items || items.length === 0) {
    el.trashList.innerHTML = '<div class="trash-empty-msg">垃圾桶是空的</div>';
    return;
  }
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'trash-item';

    const main = document.createElement('div');
    main.className = 'trash-item-main';
    const text = document.createElement('div');
    text.className = 'trash-item-text';
    text.textContent = item.text || '（空白）';
    const meta = document.createElement('div');
    meta.className = 'trash-item-meta';
    meta.textContent = formatTrashTime(item.deletedAt) + (item.cycle ? '・' + item.cycle : '');
    main.appendChild(text);
    main.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'trash-item-actions';

    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'trash-restore-btn';
    restoreBtn.textContent = '↩️ 還原';
    restoreBtn.addEventListener('click', () => restoreTrashItem(item.trashRow, row));

    const delBtn = document.createElement('button');
    delBtn.className = 'trash-delete-btn';
    delBtn.textContent = '永久刪除';
    delBtn.addEventListener('click', () => permanentlyDeleteTrashItem(item.trashRow, row));

    actions.appendChild(restoreBtn);
    actions.appendChild(delBtn);

    row.appendChild(main);
    row.appendChild(actions);
    el.trashList.appendChild(row);
  });
}

async function loadTrashList() {
  el.trashList.innerHTML = '<div class="trash-empty-msg">載入中...</div>';
  try {
    const data = await apiCall({ action: 'getTrashList' });
    renderTrashList(data.items || []);
  } catch (err) {
    el.trashList.innerHTML = '<div class="trash-empty-msg">載入失敗：' + err.message + '</div>';
  }
}

function openTrashPanel() {
  el.trashOverlay.classList.add('show');
  loadTrashList();
}

function closeTrashPanel() {
  el.trashOverlay.classList.remove('show');
}

el.openTrashBtn.addEventListener('click', openTrashPanel);
el.closeTrashBtn.addEventListener('click', closeTrashPanel);
el.trashOverlay.addEventListener('click', (e) => {
  if (e.target === el.trashOverlay) closeTrashPanel();
});

async function restoreTrashItem(trashRow, rowEl) {
  rowEl.style.opacity = '0.4';
  try {
    await apiCall({ action: 'restoreFromTrash', trashRow: trashRow });
    rowEl.remove();
    showStatus('已還原，重新整理後會出現在清單中');
    if (!el.trashList.querySelector('.trash-item')) {
      el.trashList.innerHTML = '<div class="trash-empty-msg">垃圾桶是空的</div>';
    }
  } catch (err) {
    rowEl.style.opacity = '1';
    showStatus('還原失敗：' + err.message);
  }
}

async function permanentlyDeleteTrashItem(trashRow, rowEl) {
  rowEl.style.opacity = '0.4';
  try {
    await apiCall({ action: 'deleteTrashItem', trashRow: trashRow });
    rowEl.remove();
    if (!el.trashList.querySelector('.trash-item')) {
      el.trashList.innerHTML = '<div class="trash-empty-msg">垃圾桶是空的</div>';
    }
  } catch (err) {
    rowEl.style.opacity = '1';
    showStatus('刪除失敗：' + err.message);
  }
}

armConfirmButton(el.emptyTrashBtn, '再按一次確認清空（不可復原）', async () => {
  try {
    await apiCall({ action: 'emptyTrash' });
    renderTrashList([]);
    showStatus('垃圾桶已清空');
  } catch (err) {
    showStatus('清空失敗：' + err.message);
  }
});

// ===== 關鍵字搜尋 + 合併：搜尋不限「今天到期」，全部項目都找；
// 勾選多項後可以合併成一條（文字用換行接起來，寫回第一項，其餘項目丟進垃圾桶）=====
let searchResultsCache = []; // 目前搜尋結果，[{row, text, cycle, note, tag, dateText}, ...]

function renderSearchResults(items) {
  searchResultsCache = items || [];
  el.searchResultList.innerHTML = '';

  if (searchResultsCache.length === 0) {
    el.searchResultList.innerHTML = '<div class="trash-empty-msg">沒有符合的項目</div>';
    return;
  }

  searchResultsCache.forEach(item => {
    const row = document.createElement('div');
    row.className = 'search-item';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.dataset.row = String(item.row);

    const main = document.createElement('div');
    main.className = 'search-item-main';
    const text = document.createElement('div');
    text.className = 'search-item-text';
    text.textContent = item.text || '（空白）';
    const meta = document.createElement('div');
    meta.className = 'search-item-meta';
    meta.textContent = [item.cycle, item.tag, item.dateText].filter(Boolean).join('・');
    main.appendChild(text);
    main.appendChild(meta);

    row.appendChild(checkbox);
    row.appendChild(main);
    el.searchResultList.appendChild(row);
  });
}

async function performSearch() {
  const keyword = el.searchKeywordInput.value.trim();
  if (!keyword) { showStatus('請輸入關鍵字'); return; }

  el.searchResultList.innerHTML = '<div class="trash-empty-msg">搜尋中...</div>';
  try {
    const data = await apiCall({ action: 'searchItems', keyword: keyword });
    renderSearchResults(data.items || []);
  } catch (err) {
    el.searchResultList.innerHTML = '<div class="trash-empty-msg">搜尋失敗：' + err.message + '</div>';
  }
}

function openSearchPanel() {
  el.searchOverlay.classList.add('show');
  el.searchResultList.innerHTML = '';
  searchResultsCache = [];
}

function closeSearchPanel() {
  el.searchOverlay.classList.remove('show');
}

el.openSearchBtn.addEventListener('click', openSearchPanel);
el.closeSearchBtn.addEventListener('click', closeSearchPanel);
el.searchOverlay.addEventListener('click', (e) => {
  if (e.target === el.searchOverlay) closeSearchPanel();
});
el.searchKeywordBtn.addEventListener('click', performSearch);
el.searchKeywordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') performSearch();
});

// 把勾選的多個項目合併成一項：文字依列號由小到大用換行接起來，
// 寫回「週期最短」的那一項（保留它原本的週期跟到期日），其餘項目丟進垃圾桶（跟「刪除此項」一樣可從垃圾桶還原）。
armConfirmButton(el.mergeSearchBtn, '再按一次確認合併', async () => {
  const checkedRows = Array.from(el.searchResultList.querySelectorAll('input[type="checkbox"]:checked'))
    .map(cb => parseInt(cb.dataset.row, 10));
  if (checkedRows.length < 2) { showStatus('請至少勾選兩項才能合併'); return; }

  const selected = searchResultsCache
    .filter(item => checkedRows.includes(item.row))
    .sort((a, b) => a.row - b.row);

  // 保留「週期最短」那一項的週期跟到期日；週期無法辨識（含空白）的視為最長，不會被選為保留項
  const cycleIndex = (item) => {
    const idx = CYCLE_ORDER.findIndex(code => CYCLE_MAP[code] === item.cycle);
    return idx === -1 ? Infinity : idx;
  };
  const target = selected.slice().sort((a, b) => cycleIndex(a) - cycleIndex(b) || a.row - b.row)[0];
  const others = selected.filter(item => item.row !== target.row);
  const mergedText = selected.map(item => item.text).join('\n');

  setLoading(true);
  try {
    await apiCall({ action: 'updateTextByRow', row: target.row, value: mergedText });
    // 從列號大到小依序丟進垃圾桶，避免刪除造成的列號位移影響到還沒處理的項目
    const toTrash = others.slice().sort((a, b) => b.row - a.row);
    for (const item of toTrash) {
      await apiCall({ action: 'deleteByRow', row: item.row });
    }
    showStatus('已合併 ' + selected.length + ' 項為一項');
    await performSearch();
    await loadInitData(); // 首頁到期清單的列號/內容可能已變動，重新整理
  } catch (err) {
    showStatus('合併失敗：' + err.message);
  } finally {
    setLoading(false);
  }
});

// 事項文字編輯 → 本地暫存同步更新 + 背景同步API（打字後停頓1秒才送出）
el.prayerText.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (itemsCache.length === 0) return;
    const item = itemsCache[cachePos];
    item.text = el.prayerText.value;
    apiCall({ action: 'updateTextByRow', row: item.row, value: item.text })
      .then(() => showStatus('已同步'))
      .catch(err => showStatus('同步失敗：' + err.message));
  }, 1000);
});

// 手動改週期下拉選單，跟「禱告更多／禱告更少」一樣：改完週期同時算完成這次禱告，
// 本地立刻移除（樂觀更新），背景先更新週期、再標記完成（完成時依「新」週期推算下次禱告日期）。
el.cycleSelect.addEventListener('change', () => {
  if (!el.cycleSelect.value || itemsCache.length === 0) return;
  stopSpeakingIfNeeded();

  const item = itemsCache[cachePos];
  const row = item.row;
  const newCycle = el.cycleSelect.value;
  updateCycleWarning();

  itemsCache.splice(cachePos, 1);
  if (itemsCache.length === 0) {
    renderEmptyState();
  } else {
    renderFromCache(cachePos);
  }

  apiCall({ action: 'updateCycleByRow', row: row, value: newCycle })
    .then(() => apiCall({ action: 'completeByRow', row: row }))
    .catch(err => showStatus('同步失敗，請檢查網路：' + err.message));

  showStatus('週期已更新為「' + newCycle + '」，已完成');
});

// 設定標籤後端會回報 exported=true，代表這個標籤剛好是「星期標籤」，已經同步複製到
// 對應的 Google Tasks 星期清單——這種情況跟「複製到 Tasks」按鈕一樣，複製完直接丟垃圾桶。
el.tagSelect.addEventListener('change', () => {
  if (!el.tagSelect.value || itemsCache.length === 0) return;
  const item = itemsCache[cachePos];
  item.tag = el.tagSelect.value;
  el.weekdaySelect.value = ''; // 兩個下拉選單對應同一個標籤欄位，切換時互相清空避免顯示錯亂
  updateTagWarning();
  const rowRef = item.row;
  apiCall({ action: 'updateTagByRow', row: rowRef, value: item.tag })
    .then(data => {
      if (data && data.exported) {
        moveCurrentItemToTrash();
        showStatus('已複製到對應 Google Tasks 清單，並丟進垃圾桶');
      } else if (data && data.copied) {
        showStatus('標籤已更新並複製到 Google Tasks');
      } else {
        showStatus('標籤已更新');
      }
    })
    .catch(err => showStatus('更新失敗：' + err.message));
});

el.weekdaySelect.addEventListener('change', () => {
  if (!el.weekdaySelect.value || itemsCache.length === 0) return;
  const item = itemsCache[cachePos];
  item.tag = el.weekdaySelect.value;
  el.tagSelect.value = ''; // 兩個下拉選單對應同一個標籤欄位，切換時互相清空避免顯示錯亂
  updateTagWarning();
  const rowRef = item.row;
  apiCall({ action: 'updateTagByRow', row: rowRef, value: item.tag })
    .then(data => {
      if (data && data.exported) {
        moveCurrentItemToTrash();
        showStatus('已複製到對應 Google Tasks 清單，並丟進垃圾桶');
      } else if (data && data.copied) {
        showStatus('標籤已更新並複製到 Google Tasks');
      } else {
        showStatus('標籤已更新');
      }
    })
    .catch(err => showStatus('更新失敗：' + err.message));
});

// ===== 朗讀（連禱）功能：翻頁改成純本地操作，只有標記完成在背景打API，速度不受網路影響 =====
let repeatCount = parseInt(localStorage.getItem('prayerRepeatCount'), 10) || 3;
let autoPrayActive = false;
let pureReadMode = true; // 純朗讀模式：預設開啟，開啟時連禱不會標記完成、不寫入F欄、不從清單移除
let zhVoice = null;

el.pureReadToggle.addEventListener('change', (e) => {
  pureReadMode = e.target.checked;
});

function updateRepeatButtons() {
  el.repeatOptions.querySelectorAll('button').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.count, 10) === repeatCount);
  });
}
el.repeatOptions.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-count]');
  if (!btn) return;
  repeatCount = parseInt(btn.dataset.count, 10);
  localStorage.setItem('prayerRepeatCount', String(repeatCount));
  updateRepeatButtons();
});
updateRepeatButtons();

function loadVoices() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  const zhVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  // 優先挑選裝置上較自然的語音（Google／Microsoft 神經語音通常比系統預設好聽），
  // 語系優先順序：zh-TW > zh-HK > zh-CN > 其他 zh
  const byQuality = (v) => /google|microsoft|neural|premium|enhanced/i.test(v.name) ? 0 : 1;
  const byLang = (v) => {
    const lang = v.lang.toLowerCase();
    if (lang === 'zh-tw') return 0;
    if (lang === 'zh-hk') return 1;
    if (lang === 'zh-cn') return 2;
    return 3;
  };
  zhVoices.sort((a, b) => byQuality(a) - byQuality(b) || byLang(a) - byLang(b));
  zhVoice = zhVoices[0] || null;
}
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speakOnePass(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis || !text || !text.trim()) {
      resolve();
      return;
    }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    if (zhVoice) utter.voice = zhVoice;
    utter.rate = 0.95;
    utter.pitch = 1;
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    window.speechSynthesis.speak(utter);
  });
}

async function runAutoPray() {
  try {
    const isPureMode = pureReadMode; // 記錄本次連禱開始時的模式，開始後中途切換不影響這次執行
    const totalAtStart = itemsCache.length;
    let loopCount = 0;

    while (autoPrayActive) {
      if (itemsCache.length === 0) {
        autoPrayActive = false;
        el.speakBtn.textContent = '🔊 開始連禱';
        showStatus('今天的禱告事項都完成了 🙏');
        return;
      }

      for (let i = 0; i < repeatCount; i++) {
        if (!autoPrayActive) return;
        el.speakBtn.textContent = `⏹ 停止連禱（${i + 1}/${repeatCount}）`;
        await speakOnePass(el.prayerText.value);
      }
      if (!autoPrayActive) return;

      if (isPureMode) {
        // 純朗讀模式：不打API、不標記完成、不從清單移除，單純往下一項移動
        loopCount++;
        if (loopCount >= totalAtStart) {
          autoPrayActive = false;
          el.speakBtn.textContent = '🔊 開始連禱';
          showStatus('本輪已唸完一遍（未標記完成）🙏');
          return;
        }
        renderFromCache(cachePos + 1);
        continue;
      }

      const item = itemsCache[cachePos];
      itemsCache.splice(cachePos, 1);

      apiCall({ action: 'completeByRow', row: item.row }).catch(err => {
        showStatus('同步失敗：' + err.message);
      });

      if (itemsCache.length === 0) {
        autoPrayActive = false;
        el.speakBtn.textContent = '🔊 開始連禱';
        showStatus('今天的禱告事項都完成了 🙏');
        renderEmptyState();
        return;
      }

      renderFromCache(cachePos);
    }
  } finally {
    // 不管連禱從哪個路徑結束（正常唸完、被停止、發生錯誤），都確保釋放螢幕喚醒鎖
    releaseWakeLock();
  }
}

// ===== 螢幕保持喚醒（避免連禱途中因為太久沒碰螢幕而自動熄屏鎖定中斷）=====
// 注意：這只能防止「自動熄屏」，如果手動按電源鍵鎖屏，系統仍會強制中斷背景分頁的執行，這是手機系統層級的限制。
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) {
    // 裝置不支援或無法取得，不影響其他功能，只是連禱途中螢幕可能還是會自動熄屏
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (err) { /* 忽略 */ }
    wakeLock = null;
  }
}

// 分頁切回前景時，如果連禱還在進行中，嘗試重新取得喚醒鎖（有些瀏覽器切背景時會自動釋放）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && autoPrayActive && !wakeLock) {
    requestWakeLock();
  }
});

el.speakBtn.addEventListener('click', () => {
  if (autoPrayActive) {
    autoPrayActive = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    el.speakBtn.textContent = '🔊 開始連禱';
    releaseWakeLock();
    return;
  }
  autoPrayActive = true;
  requestWakeLock();
  runAutoPray();
});

function stopSpeakingIfNeeded() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (autoPrayActive) {
    autoPrayActive = false;
    el.speakBtn.textContent = '🔊 開始連禱';
    releaseWakeLock();
  }
}

init();
</script>
