<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>禱告卡片 - 查詢</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<style>
  :root {
    --purple: #3d4a5c;
    --purple-light: #dde1e6;
    --green: #3d7a68;
    --yellow: #e6d9c8;
    --blue: #dde1e6;
    --gray-bg: #f0f1f2;
    --text-main: #2a2f36;
    --text-sub: #6b7280;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--gray-bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .header {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 12px 0;
  }
  .header h1 {
    font-size: 20px;
    color: var(--purple);
    margin: 0;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 20px;
    margin-top: 12px;
  }
  .card h2 {
    font-size: 15px;
    color: var(--purple);
    margin: 0 0 12px 0;
  }
  .query-row {
    display: flex;
    gap: 8px;
  }
  .query-row select,
  .query-row input[type="text"] {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
    background: white;
    min-width: 0;
  }
  .query-row button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--purple);
    background: var(--purple);
    color: white;
    font-size: 14px;
    white-space: nowrap;
  }
  .query-row button:active { opacity: 0.7; }
  .result-count {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-sub);
  }
  .result-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .result-item {
    padding: 12px;
    background: var(--gray-bg);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .result-item:active { opacity: 0.7; }
  .result-item .tag-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--purple);
    background: var(--purple-light);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .edit-panel {
    display: none;
  }
  .edit-panel.show {
    display: block;
  }
  .back-btn {
    margin-bottom: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: white;
    color: var(--text-sub);
    font-size: 13px;
  }
  .prayer-text {
    font-size: 18px;
    line-height: 1.6;
    min-height: 100px;
    white-space: pre-wrap;
    outline: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    width: 100%;
    background: transparent;
    font-family: inherit;
    resize: vertical;
    color: var(--text-main);
  }
  .prayer-text:focus {
    background: #fafafa;
  }
  .meta-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .meta-field {
    flex: 1;
    min-width: 130px;
  }
  .meta-field label {
    display: block;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 4px;
  }
  .meta-field select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
    background: white;
  }
  .meta-field.cycle select { background: var(--yellow); }
  .meta-field.cycle select.cycle-empty {
    background: #ff8a80;
    border: 1px solid #d32f2f;
    color: #7a0000;
    font-weight: bold;
  }
  .meta-field.tag select { background: var(--blue); }
  .meta-field.weekday select { background: #d9ead3; }
  .note {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-sub);
    white-space: pre-wrap;
  }
  .delete-row {
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }
  .delete-row button {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: transparent;
    color: #b0413e;
    font-size: 13px;
    opacity: 0.7;
  }
  .delete-row button:active { opacity: 1; }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-sub);
    height: 16px;
    text-align: center;
  }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--purple);
    display: none;
  }
  .loading-overlay.show { display: flex; }
  .empty-hint {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-sub);
    text-align: center;
  }

  /* ===== 標籤查詢卡片瀏覽（跟 index.html 同一套介面） ===== */
  .tag-card-view {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tag-card-view .progress {
    font-size: 14px;
    color: var(--text-sub);
    margin-top: 4px;
    text-align: center;
  }
  .add-tag-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .add-tag-row input[type="text"] {
    flex: 1;
    min-width: 100px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
  }
  .add-tag-checkbox {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
  }
  .add-tag-checkbox input { width: 16px; height: 16px; }
  .add-tag-row button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--purple);
    background: white;
    color: var(--purple);
    font-size: 13px;
    white-space: nowrap;
  }
  .copy-tasks-btn {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--purple);
    background: white;
    color: var(--purple);
    font-size: 14px;
    cursor: pointer;
  }
  .copy-tasks-btn:active { opacity: 0.7; }
  .controls {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 16px 0;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: var(--purple);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:active { opacity: 0.7; }
  .btn.secondary { background: var(--green); }
  .btn.complete { background: #2e8b74; }
  .controls.triple {
    gap: 6px;
  }
  .controls.triple .btn {
    font-size: 14px;
    padding: 14px 2px;
  }
  .jump-row {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    justify-content: center;
  }
  .jump-row input {
    width: 70px;
    padding: 8px;
    text-align: center;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
  }
  .jump-row button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--purple);
    background: white;
    color: var(--purple);
    font-size: 14px;
  }
  .toggle-row {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .repeat-row {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .repeat-row .repeat-options {
    display: flex;
    gap: 6px;
  }
  .repeat-row button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--purple);
    background: white;
    color: var(--purple);
    font-size: 14px;
  }
  .repeat-row button.active {
    background: var(--purple);
    color: white;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .2s;
    border-radius: 24px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .2s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--purple); }
  input:checked + .slider:before { transform: translateX(20px); }
  .danger-zone {
    width: 100%;
    max-width: 480px;
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid #e5e5e5;
    display: flex;
    justify-content: center;
  }
  .danger-zone button {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: transparent;
    color: #b0413e;
    font-size: 13px;
    opacity: 0.6;
  }
  .danger-zone button:active { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>🔍 禱告事項查詢</h1>
</div>

<div class="card" id="listView">
  <h2>依標籤查詢</h2>
  <div class="query-row">
    <select id="tagQuerySelect"></select>
    <button id="tagQueryBtn">查詢</button>
  </div>

  <h2 style="margin-top:24px;">關鍵字查詢</h2>
  <div class="query-row">
    <input type="text" id="keywordInput" placeholder="輸入關鍵字...">
    <button id="keywordQueryBtn">查詢</button>
  </div>
  <div class="result-count" id="keywordResultCount"></div>
  <div class="result-list" id="keywordResultList"></div>
</div>

<div class="tag-card-view" id="tagCardView" style="display:none;">
  <button class="back-btn" id="tcBackBtn" style="align-self:flex-start; max-width:480px; width:100%;">← 返回查詢結果</button>

  <div class="header" style="padding-top:0;">
    <div class="progress" id="tcProgress">載入中...</div>
  </div>

  <div class="card">
    <textarea class="prayer-text" id="tcPrayerText" placeholder="禱告事項內容..."></textarea>

    <div class="meta-row">
      <div class="meta-field cycle">
        <label>DG 週期</label>
        <select id="tcCycleSelect"></select>
      </div>
      <div class="meta-field tag">
        <label>標籤</label>
        <select id="tcTagSelect"></select>
      </div>
    </div>

    <div class="meta-row">
      <div class="meta-field weekday">
        <label>星期標籤</label>
        <select id="tcWeekdaySelect"></select>
      </div>
    </div>

    <div class="add-tag-row">
      <input type="text" id="tcNewTagInput" placeholder="新增標籤...">
      <label class="add-tag-checkbox">
        <input type="checkbox" id="tcSaveTagCheckbox" checked>
        <span>加入清單</span>
      </label>
      <button id="tcAddTagBtn">套用</button>
    </div>

    <button class="copy-tasks-btn" id="tcCopyToTasksBtn">📋 複製到 Google Tasks 預設清單</button>

    <div class="note" id="tcNoteText"></div>
  </div>

  <div class="controls triple">
    <button class="btn secondary" id="tcPrevBtn">◀ 上一項</button>
    <button class="btn" id="tcNextBtn">下一項 ▶</button>
    <button class="btn complete" id="tcCompleteBtn">✅ 完成</button>
  </div>

  <div class="controls">
    <button class="btn secondary" id="tcRandomBtn">🎲 隨機一項</button>
    <button class="btn" id="tcSpeakBtn" style="background: var(--purple);">🔊 開始連禱</button>
  </div>

  <div class="repeat-row">
    <span>每項朗讀次數：</span>
    <div class="repeat-options" id="tcRepeatOptions">
      <button type="button" data-count="1">1 次</button>
      <button type="button" data-count="2">2 次</button>
      <button type="button" data-count="3">3 次</button>
    </div>
  </div>

  <div class="toggle-row">
    <label class="switch">
      <input type="checkbox" id="tcPureReadToggle" checked>
      <span class="slider"></span>
    </label>
    <span>純朗讀模式（不標記完成）</span>
  </div>

  <div class="jump-row">
    <input type="number" id="tcJumpInput" placeholder="第幾項" min="1">
    <button id="tcJumpBtn">跳到</button>
  </div>

  <div class="status" id="tcStatus"></div>

  <div class="danger-zone">
    <button id="tcDeleteBtn">🗑 刪除此項</button>
  </div>
</div>

<div class="card edit-panel" id="editPanel">
  <button class="back-btn" id="backBtn">← 返回查詢結果</button>

  <textarea class="prayer-text" id="editText" placeholder="禱告事項內容..."></textarea>

  <div class="meta-row">
    <div class="meta-field cycle">
      <label>DG 週期</label>
      <select id="editCycleSelect"></select>
    </div>
    <div class="meta-field tag">
      <label>標籤</label>
      <select id="editTagSelect"></select>
    </div>
  </div>

  <div class="meta-row">
    <div class="meta-field weekday">
      <label>星期標籤</label>
      <select id="editWeekdaySelect"></select>
    </div>
  </div>

  <div class="note" id="editNoteText"></div>

  <div class="delete-row">
    <button id="editDeleteBtn">🗑 刪除此項</button>
  </div>

  <div class="status" id="editStatus"></div>
</div>

<div class="status" id="status"></div>

<div class="loading-overlay" id="loadingOverlay">處理中...</div>

<script>
// ⚠️ 跟 index.html 使用同一個已部署的網頁應用程式網址
const API_URL = 'https://script.google.com/macros/s/AKfycbyaeqMjoNHYhTSMeu6uTCHipau8egCa72-SOWIARZJ-85GE82Bc0Audu62lQS8IEgxmyw/exec';

const CYCLE_MAP = {
  'D': 'D每天', '2': '2每兩天', '3': '3每三天', '4': '4每四天', '5': '5每五天',
  'W': 'W每週', 'DW': 'DW每兩週',
  'M': 'M每月', '2M': '2M每兩個月', 'S': 'S每季', 'HY': 'HY每半年', 'Y': 'Y每年'
};
const TAG_MAP = { 'G': 'G工作日', 'W': 'W週末', 'F': 'F家庭會議', 'A': 'A安祺禱告', 'AI': 'A安祺輸入' };
const WEEKDAY_MAP = {
  '週一': '週一', '週二': '週二', '週三': '週三', '週四': '週四',
  '週五': '週五', '週六': '週六', '週日': '週日'
};

let customTagsCache = [];
let currentKeywordResults = []; // 目前關鍵字查詢的結果，點進去編輯時用來對照
let editingItem = null;         // 目前正在編輯的項目 {row, text, cycle, note, tag}
let saveTimer = null;

const el = {
  tagQuerySelect: document.getElementById('tagQuerySelect'),
  tagQueryBtn: document.getElementById('tagQueryBtn'),
  keywordInput: document.getElementById('keywordInput'),
  keywordQueryBtn: document.getElementById('keywordQueryBtn'),
  keywordResultCount: document.getElementById('keywordResultCount'),
  keywordResultList: document.getElementById('keywordResultList'),
  listView: document.getElementById('listView'),
  tagCardView: document.getElementById('tagCardView'),
  tcBackBtn: document.getElementById('tcBackBtn'),
  tcProgress: document.getElementById('tcProgress'),
  tcPrayerText: document.getElementById('tcPrayerText'),
  tcCycleSelect: document.getElementById('tcCycleSelect'),
  tcTagSelect: document.getElementById('tcTagSelect'),
  tcWeekdaySelect: document.getElementById('tcWeekdaySelect'),
  tcNewTagInput: document.getElementById('tcNewTagInput'),
  tcSaveTagCheckbox: document.getElementById('tcSaveTagCheckbox'),
  tcAddTagBtn: document.getElementById('tcAddTagBtn'),
  tcCopyToTasksBtn: document.getElementById('tcCopyToTasksBtn'),
  tcNoteText: document.getElementById('tcNoteText'),
  tcPrevBtn: document.getElementById('tcPrevBtn'),
  tcNextBtn: document.getElementById('tcNextBtn'),
  tcCompleteBtn: document.getElementById('tcCompleteBtn'),
  tcRandomBtn: document.getElementById('tcRandomBtn'),
  tcSpeakBtn: document.getElementById('tcSpeakBtn'),
  tcRepeatOptions: document.getElementById('tcRepeatOptions'),
  tcPureReadToggle: document.getElementById('tcPureReadToggle'),
  tcJumpInput: document.getElementById('tcJumpInput'),
  tcJumpBtn: document.getElementById('tcJumpBtn'),
  tcStatus: document.getElementById('tcStatus'),
  tcDeleteBtn: document.getElementById('tcDeleteBtn'),
  editPanel: document.getElementById('editPanel'),
  backBtn: document.getElementById('backBtn'),
  editText: document.getElementById('editText'),
  editCycleSelect: document.getElementById('editCycleSelect'),
  editTagSelect: document.getElementById('editTagSelect'),
  editWeekdaySelect: document.getElementById('editWeekdaySelect'),
  editNoteText: document.getElementById('editNoteText'),
  editDeleteBtn: document.getElementById('editDeleteBtn'),
  editStatus: document.getElementById('editStatus'),
  status: document.getElementById('status'),
  loadingOverlay: document.getElementById('loadingOverlay')
};

function setLoading(show) {
  el.loadingOverlay.classList.toggle('show', show);
}

function showStatus(target, msg) {
  target.textContent = msg;
  setTimeout(() => { target.textContent = ''; }, 1800);
}

async function apiCall(params) {
  params._t = Date.now();
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url, { cache: 'no-store' });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function populateSelect(selectEl, map, placeholder) {
  selectEl.innerHTML = '<option value="">' + placeholder + '</option>';
  Object.values(map).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

async function loadTagList() {
  try {
    const data = await apiCall({ action: 'getTagList' });
    customTagsCache = data.custom || [];
  } catch (err) {
    customTagsCache = [];
  }
}

// 標籤查詢下拉選單：內建標籤 + 自訂標籤 + 星期標籤，全部放在同一個選單裡方便查詢
function populateTagQuerySelect() {
  el.tagQuerySelect.innerHTML = '<option value="">選擇標籤</option>';

  Object.values(TAG_MAP).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.tagQuerySelect.appendChild(opt);
  });

  Object.values(WEEKDAY_MAP).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.tagQuerySelect.appendChild(opt);
  });

  customTagsCache
    .filter(v => !WEEKDAY_MAP[v])
    .forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v + '（自訂）';
      el.tagQuerySelect.appendChild(opt);
    });
}

// 標籤下拉選單（跟 index.html 一致：內建 + 自訂，星期獨立一個選單）
// 給編輯面板（editTagSelect）跟標籤卡片瀏覽（tcTagSelect）共用
function populateTagSelectInto(selectEl) {
  selectEl.innerHTML = '<option value="">選擇標籤</option>';

  Object.values(TAG_MAP).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });

  customTagsCache
    .filter(v => !WEEKDAY_MAP[v])
    .forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v + '（自訂）';
      selectEl.appendChild(opt);
    });
}

// ===== 依標籤查詢：跟 index.html 完全一樣的卡片瀏覽介面，依 E 欄日期由舊到新排列 =====
el.tagQueryBtn.addEventListener('click', async () => {
  const tag = el.tagQuerySelect.value;
  if (!tag) { showStatus(el.status, '請先選擇標籤'); return; }

  setLoading(true);
  try {
    const data = await apiCall({ action: 'getItemsByTag', tag: tag }); // 後端已依E欄日期由舊到新排序
    tcItemsCache = data.items || [];
    tcCachePos = 0;

    if (tcItemsCache.length === 0) {
      showStatus(el.status, '沒有符合此標籤的項目');
      return;
    }

    el.listView.style.display = 'none';
    el.tagCardView.style.display = 'flex';
    tcRenderFromCache(0);
  } catch (err) {
    showStatus(el.status, '查詢失敗：' + err.message);
  } finally {
    setLoading(false);
  }
});

// ===== 關鍵字查詢：列出所有符合的項目，可點進去個別編輯 =====
el.keywordQueryBtn.addEventListener('click', async () => {
  const keyword = el.keywordInput.value.trim();
  if (!keyword) { showStatus(el.status, '請輸入關鍵字'); return; }

  setLoading(true);
  try {
    const data = await apiCall({ action: 'searchItems', keyword: keyword });
    currentKeywordResults = data.items || [];
    renderKeywordResults();
  } catch (err) {
    showStatus(el.status, '查詢失敗：' + err.message);
  } finally {
    setLoading(false);
  }
});

function renderKeywordResults() {
  el.keywordResultList.innerHTML = '';

  if (currentKeywordResults.length === 0) {
    el.keywordResultCount.textContent = '沒有符合的項目';
    return;
  }

  el.keywordResultCount.textContent = '共 ' + currentKeywordResults.length + ' 筆';

  currentKeywordResults.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.textContent = item.text;
    if (item.tag) {
      const badge = document.createElement('div');
      badge.className = 'tag-badge';
      badge.textContent = item.tag;
      div.appendChild(badge);
    }
    div.addEventListener('click', () => openEditPanel(idx));
    el.keywordResultList.appendChild(div);
  });
}

// ===== 編輯面板 =====
function openEditPanel(idx) {
  editingItem = currentKeywordResults[idx];
  el.editText.value = editingItem.text || '';
  el.editCycleSelect.value = editingItem.cycle || '';
  el.editTagSelect.value = WEEKDAY_MAP[editingItem.tag] ? '' : (editingItem.tag || '');
  el.editWeekdaySelect.value = WEEKDAY_MAP[editingItem.tag] ? editingItem.tag : '';
  el.editNoteText.textContent = editingItem.note ? ('備註：' + editingItem.note) : '';

  el.listView.style.display = 'none';
  el.editPanel.classList.add('show');
}

function closeEditPanel() {
  editingItem = null;
  el.editPanel.classList.remove('show');
  el.listView.style.display = '';
}

el.backBtn.addEventListener('click', closeEditPanel);

el.editText.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!editingItem) return;
    editingItem.text = el.editText.value;
    apiCall({ action: 'updateTextByRow', row: editingItem.row, value: editingItem.text })
      .then(() => showStatus(el.editStatus, '已同步'))
      .catch(err => showStatus(el.editStatus, '同步失敗：' + err.message));
  }, 1000);
});

el.editCycleSelect.addEventListener('change', () => {
  if (!editingItem || !el.editCycleSelect.value) return;
  editingItem.cycle = el.editCycleSelect.value;
  apiCall({ action: 'updateCycleByRow', row: editingItem.row, value: editingItem.cycle })
    .then(() => showStatus(el.editStatus, '週期已更新'))
    .catch(err => showStatus(el.editStatus, '更新失敗：' + err.message));
});

el.editTagSelect.addEventListener('change', () => {
  if (!editingItem || !el.editTagSelect.value) return;
  editingItem.tag = el.editTagSelect.value;
  el.editWeekdaySelect.value = '';
  apiCall({ action: 'updateTagByRow', row: editingItem.row, value: editingItem.tag })
    .then(() => showStatus(el.editStatus, '標籤已更新'))
    .catch(err => showStatus(el.editStatus, '更新失敗：' + err.message));
});

el.editWeekdaySelect.addEventListener('change', () => {
  if (!editingItem || !el.editWeekdaySelect.value) return;
  editingItem.tag = el.editWeekdaySelect.value;
  el.editTagSelect.value = '';
  apiCall({ action: 'updateTagByRow', row: editingItem.row, value: editingItem.tag })
    .then(() => showStatus(el.editStatus, '標籤已更新'))
    .catch(err => showStatus(el.editStatus, '更新失敗：' + err.message));
});

el.editDeleteBtn.addEventListener('click', async () => {
  if (!editingItem) return;
  const preview = (editingItem.text || '').slice(0, 20);
  const confirmed = window.confirm(
    '確定要刪除這一項嗎？\n\n「' + preview + ((editingItem.text || '').length > 20 ? '...' : '') + '」\n\n這個動作無法復原。'
  );
  if (!confirmed) return;

  setLoading(true);
  try {
    await apiCall({ action: 'deleteByRow', row: editingItem.row });
    currentKeywordResults = currentKeywordResults.filter(it => it.row !== editingItem.row);
    renderKeywordResults();
    closeEditPanel();
    showStatus(el.status, '已刪除');
  } catch (err) {
    showStatus(el.editStatus, '刪除失敗：' + err.message);
  } finally {
    setLoading(false);
  }
});

// ===== 標籤卡片瀏覽：跟 index.html 完全一樣的介面與功能 =====
let tcItemsCache = [];   // 目前這次標籤查詢的結果（後端已依E欄日期由舊到新排序）
let tcCachePos = 0;
let tcSaveTimer = null;

function tcUpdateCycleWarning() {
  // 跟 index.html 一致：週期空白時用醒目底色提醒，這裡沿用同一個 class 名稱即可
  el.tcCycleSelect.classList.toggle('cycle-empty', !el.tcCycleSelect.value);
}

function tcRenderFromCache(pos) {
  if (tcItemsCache.length === 0) {
    tcRenderEmptyState();
    return;
  }
  tcCachePos = ((pos % tcItemsCache.length) + tcItemsCache.length) % tcItemsCache.length;
  const item = tcItemsCache[tcCachePos];

  el.tcProgress.textContent = `第 ${tcCachePos + 1} 項 / 共 ${tcItemsCache.length} 項`;
  el.tcPrayerText.value = item.text || '';
  el.tcCycleSelect.value = item.cycle || '';
  el.tcTagSelect.value = WEEKDAY_MAP[item.tag] ? '' : (item.tag || '');
  el.tcWeekdaySelect.value = WEEKDAY_MAP[item.tag] ? item.tag : '';
  el.tcNoteText.textContent = item.note ? ('備註：' + item.note) : '';
  tcUpdateCycleWarning();
}

function tcRenderEmptyState() {
  el.tcProgress.textContent = '第 0 項 / 共 0 項';
  el.tcPrayerText.value = '（此標籤目前沒有項目）';
  el.tcCycleSelect.value = '';
  el.tcTagSelect.value = '';
  el.tcWeekdaySelect.value = '';
  el.tcNoteText.textContent = '';
  tcUpdateCycleWarning();
}

el.tcBackBtn.addEventListener('click', () => {
  tcStopSpeakingIfNeeded();
  el.tagCardView.style.display = 'none';
  el.listView.style.display = '';
});

el.tcAddTagBtn.addEventListener('click', async () => {
  if (tcItemsCache.length === 0) return;

  const newTag = el.tcNewTagInput.value.trim();
  if (!newTag) { showStatus(el.tcStatus, '請輸入標籤內容'); return; }

  const item = tcItemsCache[tcCachePos];
  item.tag = newTag;
  el.tcTagSelect.value = '';
  el.tcWeekdaySelect.value = '';
  const rowRef = item.row;

  apiCall({ action: 'updateTagByRow', row: rowRef, value: newTag })
    .then(data => {
      if (data && data.exported) {
        showStatus(el.tcStatus, '已複製到對應 Google Tasks 清單');
      } else if (data && data.copied) {
        showStatus(el.tcStatus, '標籤已套用並複製到 Google Tasks');
      } else {
        showStatus(el.tcStatus, '標籤已套用');
      }
    })
    .catch(err => showStatus(el.tcStatus, '套用失敗：' + err.message));

  if (el.tcSaveTagCheckbox.checked) {
    try {
      const data = await apiCall({ action: 'addCustomTag', value: newTag });
      customTagsCache = data.custom || [];
      populateTagSelectInto(el.editTagSelect);
      populateTagSelectInto(el.tcTagSelect);
      el.tcTagSelect.value = newTag;
    } catch (err) {
      showStatus(el.tcStatus, '加入清單失敗：' + err.message);
    }
  }

  el.tcNewTagInput.value = '';
});

el.tcCopyToTasksBtn.addEventListener('click', () => {
  if (tcItemsCache.length === 0) return;
  const item = tcItemsCache[tcCachePos];

  apiCall({ action: 'copyToTasks', row: item.row })
    .then(data => {
      if (data && data.copied) {
        showStatus(el.tcStatus, '已複製到 Google Tasks 預設清單');
      } else {
        showStatus(el.tcStatus, '複製失敗，請稍後再試');
      }
    })
    .catch(err => showStatus(el.tcStatus, '複製失敗：' + err.message));
});

el.tcPrevBtn.addEventListener('click', () => {
  if (tcItemsCache.length === 0) return;
  tcStopSpeakingIfNeeded();
  tcRenderFromCache(tcCachePos - 1);
});

el.tcRandomBtn.addEventListener('click', () => {
  if (tcItemsCache.length === 0) return;
  tcStopSpeakingIfNeeded();
  tcRenderFromCache(Math.floor(Math.random() * tcItemsCache.length));
});

el.tcJumpBtn.addEventListener('click', () => {
  if (tcItemsCache.length === 0) { showStatus(el.tcStatus, '目前沒有項目'); return; }
  const val = parseInt(el.tcJumpInput.value, 10);
  if (!val || val < 1) { showStatus(el.tcStatus, '請輸入有效項次'); return; }
  tcRenderFromCache(val - 1);
  el.tcJumpInput.value = '';
});

el.tcNextBtn.addEventListener('click', () => {
  if (tcItemsCache.length === 0) return;
  tcStopSpeakingIfNeeded();
  tcRenderFromCache(tcCachePos + 1);
});

el.tcCompleteBtn.addEventListener('click', () => {
  if (tcItemsCache.length === 0) return;
  tcStopSpeakingIfNeeded();

  const item = tcItemsCache[tcCachePos];
  tcItemsCache.splice(tcCachePos, 1);

  if (tcItemsCache.length === 0) {
    tcRenderEmptyState();
  } else {
    tcRenderFromCache(tcCachePos);
  }

  apiCall({ action: 'completeByRow', row: item.row }).catch(err => {
    showStatus(el.tcStatus, '同步失敗，請檢查網路：' + err.message);
  });
});

el.tcDeleteBtn.addEventListener('click', async () => {
  if (tcItemsCache.length === 0) return;
  const item = tcItemsCache[tcCachePos];
  const preview = (item.text || '').slice(0, 20);
  const confirmed = window.confirm(
    '確定要刪除這一項嗎？\n\n「' + preview + ((item.text || '').length > 20 ? '...' : '') + '」\n\n這個動作無法復原。'
  );
  if (!confirmed) return;

  tcStopSpeakingIfNeeded();
  setLoading(true);
  try {
    await apiCall({ action: 'deleteByRow', row: item.row });

    const deletedRow = item.row;
    tcItemsCache.splice(tcCachePos, 1);
    tcItemsCache.forEach(it => { if (it.row > deletedRow) it.row -= 1; });

    if (tcItemsCache.length === 0) {
      tcRenderEmptyState();
    } else {
      tcRenderFromCache(tcCachePos);
    }
    showStatus(el.tcStatus, '已刪除');
  } catch (err) {
    showStatus(el.tcStatus, '刪除失敗：' + err.message);
  } finally {
    setLoading(false);
  }
});

el.tcPrayerText.addEventListener('input', () => {
  clearTimeout(tcSaveTimer);
  tcSaveTimer = setTimeout(() => {
    if (tcItemsCache.length === 0) return;
    const item = tcItemsCache[tcCachePos];
    item.text = el.tcPrayerText.value;
    apiCall({ action: 'updateTextByRow', row: item.row, value: item.text })
      .then(() => showStatus(el.tcStatus, '已同步'))
      .catch(err => showStatus(el.tcStatus, '同步失敗：' + err.message));
  }, 1000);
});

el.tcCycleSelect.addEventListener('change', () => {
  if (!el.tcCycleSelect.value || tcItemsCache.length === 0) return;
  const item = tcItemsCache[tcCachePos];
  item.cycle = el.tcCycleSelect.value;
  tcUpdateCycleWarning();
  apiCall({ action: 'updateCycleByRow', row: item.row, value: item.cycle })
    .then(() => showStatus(el.tcStatus, '週期已更新'))
    .catch(err => showStatus(el.tcStatus, '更新失敗：' + err.message));
});

el.tcTagSelect.addEventListener('change', () => {
  if (!el.tcTagSelect.value || tcItemsCache.length === 0) return;
  const item = tcItemsCache[tcCachePos];
  item.tag = el.tcTagSelect.value;
  el.tcWeekdaySelect.value = '';
  const rowRef = item.row;
  apiCall({ action: 'updateTagByRow', row: rowRef, value: item.tag })
    .then(data => {
      if (data && data.exported) {
        showStatus(el.tcStatus, '已複製到對應 Google Tasks 清單');
      } else if (data && data.copied) {
        showStatus(el.tcStatus, '標籤已更新並複製到 Google Tasks');
      } else {
        showStatus(el.tcStatus, '標籤已更新');
      }
    })
    .catch(err => showStatus(el.tcStatus, '更新失敗：' + err.message));
});

el.tcWeekdaySelect.addEventListener('change', () => {
  if (!el.tcWeekdaySelect.value || tcItemsCache.length === 0) return;
  const item = tcItemsCache[tcCachePos];
  item.tag = el.tcWeekdaySelect.value;
  el.tcTagSelect.value = '';
  const rowRef = item.row;
  apiCall({ action: 'updateTagByRow', row: rowRef, value: item.tag })
    .then(data => {
      if (data && data.exported) {
        showStatus(el.tcStatus, '已複製到對應 Google Tasks 清單');
      } else if (data && data.copied) {
        showStatus(el.tcStatus, '標籤已更新並複製到 Google Tasks');
      } else {
        showStatus(el.tcStatus, '標籤已更新');
      }
    })
    .catch(err => showStatus(el.tcStatus, '更新失敗：' + err.message));
});

// ===== 朗讀（連禱）功能：跟 index.html 完全一樣 =====
let tcRepeatCount = parseInt(localStorage.getItem('prayerRepeatCount'), 10) || 3;
let tcAutoPrayActive = false;
let tcPureReadMode = true;
let tcZhVoice = null;

el.tcPureReadToggle.addEventListener('change', (e) => {
  tcPureReadMode = e.target.checked;
});

function tcUpdateRepeatButtons() {
  el.tcRepeatOptions.querySelectorAll('button').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.count, 10) === tcRepeatCount);
  });
}
el.tcRepeatOptions.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-count]');
  if (!btn) return;
  tcRepeatCount = parseInt(btn.dataset.count, 10);
  localStorage.setItem('prayerRepeatCount', String(tcRepeatCount));
  tcUpdateRepeatButtons();
});
tcUpdateRepeatButtons();

function tcLoadVoices() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  tcZhVoice = voices.find(v => v.lang === 'zh-TW')
        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'))
        || null;
}
if (window.speechSynthesis) {
  tcLoadVoices();
  window.speechSynthesis.onvoiceschanged = tcLoadVoices;
}

function tcSpeakOnePass(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis || !text || !text.trim()) {
      resolve();
      return;
    }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    if (tcZhVoice) utter.voice = tcZhVoice;
    utter.rate = 0.95;
    utter.pitch = 1;
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    window.speechSynthesis.speak(utter);
  });
}

async function tcRunAutoPray() {
  try {
    const isPureMode = tcPureReadMode;
    const totalAtStart = tcItemsCache.length;
    let loopCount = 0;

    while (tcAutoPrayActive) {
      if (tcItemsCache.length === 0) {
        tcAutoPrayActive = false;
        el.tcSpeakBtn.textContent = '🔊 開始連禱';
        showStatus(el.tcStatus, '這個標籤的事項都完成了 🙏');
        return;
      }

      for (let i = 0; i < tcRepeatCount; i++) {
        if (!tcAutoPrayActive) return;
        el.tcSpeakBtn.textContent = `⏹ 停止連禱（${i + 1}/${tcRepeatCount}）`;
        await tcSpeakOnePass(el.tcPrayerText.value);
      }
      if (!tcAutoPrayActive) return;

      if (isPureMode) {
        loopCount++;
        if (loopCount >= totalAtStart) {
          tcAutoPrayActive = false;
          el.tcSpeakBtn.textContent = '🔊 開始連禱';
          showStatus(el.tcStatus, '本輪已唸完一遍（未標記完成）🙏');
          return;
        }
        tcRenderFromCache(tcCachePos + 1);
        continue;
      }

      const item = tcItemsCache[tcCachePos];
      tcItemsCache.splice(tcCachePos, 1);

      apiCall({ action: 'completeByRow', row: item.row }).catch(err => {
        showStatus(el.tcStatus, '同步失敗：' + err.message);
      });

      if (tcItemsCache.length === 0) {
        tcAutoPrayActive = false;
        el.tcSpeakBtn.textContent = '🔊 開始連禱';
        showStatus(el.tcStatus, '這個標籤的事項都完成了 🙏');
        tcRenderEmptyState();
        return;
      }

      tcRenderFromCache(tcCachePos);
    }
  } finally {
    tcReleaseWakeLock();
  }
}

let tcWakeLock = null;

async function tcRequestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      tcWakeLock = await navigator.wakeLock.request('screen');
      tcWakeLock.addEventListener('release', () => { tcWakeLock = null; });
    }
  } catch (err) {
    // 裝置不支援或無法取得，不影響其他功能
  }
}

async function tcReleaseWakeLock() {
  if (tcWakeLock) {
    try { await tcWakeLock.release(); } catch (err) { /* 忽略 */ }
    tcWakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && tcAutoPrayActive && !tcWakeLock) {
    tcRequestWakeLock();
  }
});

el.tcSpeakBtn.addEventListener('click', () => {
  if (tcAutoPrayActive) {
    tcAutoPrayActive = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    el.tcSpeakBtn.textContent = '🔊 開始連禱';
    tcReleaseWakeLock();
    return;
  }
  tcAutoPrayActive = true;
  tcRequestWakeLock();
  tcRunAutoPray();
});

function tcStopSpeakingIfNeeded() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (tcAutoPrayActive) {
    tcAutoPrayActive = false;
    el.tcSpeakBtn.textContent = '🔊 開始連禱';
    tcReleaseWakeLock();
  }
}

async function init() {
  populateSelect(el.editCycleSelect, CYCLE_MAP, '選擇週期');
  populateSelect(el.editWeekdaySelect, WEEKDAY_MAP, '選擇星期標籤');
  populateSelect(el.tcCycleSelect, CYCLE_MAP, '選擇週期');
  populateSelect(el.tcWeekdaySelect, WEEKDAY_MAP, '選擇星期標籤');
  await loadTagList();
  populateTagQuerySelect();
  populateTagSelectInto(el.editTagSelect);
  populateTagSelectInto(el.tcTagSelect);
}

init();
</script>
